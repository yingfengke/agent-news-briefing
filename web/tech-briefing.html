    const __NEWS_DATA__ = [{"title": "NVIDIA 开源 Nemotron-Labs-Sigma：3B/8B 连续扩散语言模型共 14 个 checkpoint", "summary": "NVIDIA 发布 Nemotron-Labs-Sigma，一套连续扩散语言模型，共 14 个开放 checkpoint，覆盖 3B 与 8B 两档参数规模。与自回归逐 token 解码不同，扩散式生成支持并行去噪，官方强调其在吞吐与可控生成上的潜力，权重与推理代码一并开放。", "analysis": "扩散 LM 终于有人把 checkpoint 铺到 14 个了，3B/8B 双档说明 NVIDIA 在认真做 scaling 曲线而不是发个玩具。连续扩散的核心卖点是并行去噪带来的低延迟，但代价是采样步数与质量之间的 trade-off，实际 tokens/s 能不能打过同尺寸自回归模型要看 KV 之外的开销。14 个 checkpoint 大概率是不同步数/噪声调度的消融，对研究者复现很有价值，但生产落地还早。", "link": "https://www.marktechpost.com/2026/11/20/nvidia-nemotron-labs-sigma-continuous-diffusion-language-model/", "source": "MarkTechPost", "score": 4.0, "tags": ["大模型", "扩散模型", "开源"], "category": "大模型", "published_at": "2026-11-20T14:44:52+00:00", "published_at_disp": "11-20 22:44"}, {"title": "Anthropic 数学家称与 Claude 一同攻克黎曼猜想", "summary": "Anthropic 一位数学家声称在与 Claude 协作下证明了有 167 年历史的黎曼猜想，该问题属于千禧年大奖难题之一。几乎同时，另一位研究者也宣称独立给出证明，两方结果均待数学界验证。事件发生在 Anthropic 11 月 19 日上市之后，具体证明形式与 Claude 的参与程度尚未公开。", "analysis": "黎曼猜想的证明如果成立就是数学史级别的事件，但当前状态是「宣称」而非「验证」，历史上这类宣称的存活率极低。Claude 在其中的角色需要厘清：是辅助搜索反例、形式化验证，还是真的贡献了证明思路。若后续能过 Lean/Coq 形式化检查，那才是硬证据；在此之前，这条更像个 IPO 后的叙事放大器。", "link": "https://www.theverge.com/ai-artificial-intelligence/1010051/anthropic-riemann-hypothesis-millennium-prize-problem", "source": "The Verge AI", "score": 3.8, "tags": ["行业动态", "论文与研究", "数学推理"], "category": "行业动态", "published_at": "2026-11-20T16:34:13+00:00", "published_at_disp": "11-21 00:34"}, {"title": "AI 宣称解决 167 年黎曼猜想，人类数学家同时给出证明", "summary": "围绕黎曼猜想的双重宣称引发数学界震动：一方是 AI 驱动的结果，另一方是人类数学家独立给出的证明，两者几乎同期出现。报道称数学家们对 AI 参与的这一结果反应强烈，但两方证明均未经同行评审，正确性有待形式化验证工具检验。", "analysis": "同一难题被 AI 和人类同时宣称解决，这个巧合本身就是个信号：要么问题到了突破窗口期，要么是 LLM 把大量研究者的注意力集中到了同一路径上。判定标准很明确——能不能过 Lean 4 的形式化检查，以及证明长度是否在人类可审阅范围内。在验证完成前，任何「AI 解决千禧难题」的标题都该打问号。", "link": "https://techcrunch.com/2026/11/20/ai-claimed-a-solution-to-the-167-year-old-riemann-hypothesis-and-a-human-did-too/", "source": "TechCrunch AI", "score": 3.7, "tags": ["论文与研究", "数学推理"], "category": "论文与研究", "published_at": "2026-11-20T19:32:08+00:00", "published_at_disp": "11-21 03:32"}, {"title": "RadixArk 发布 DaisyRose-27B：纯 RL 训练的 27B Agentic 编码模型", "summary": "RadixArk 推出首个开放权重模型 DaisyRose-27B，参数量 27B，主打 Agentic 编码场景，训练流程完全依赖强化学习而非 SFT 冷启动。官方称其在多步工具调用与代码修复任务上表现稳定，权重已开放下载，具体 benchmark 分数与训练 token 规模未在摘要中披露。", "analysis": "纯 RL 训 27B 编码 Agent 是个有意思的路线选择：跳过 SFT 意味着模型行为完全由 reward 塑形，理论上更贴合长程任务，但冷启动方差大、reward hacking 风险高。27B 这个尺寸卡在单卡 80G 可跑推理的甜点位上，对本地 Agent 部署友好。真正的坑在于纯 RL 容易在分布外任务上崩，需要看它有没有公布 SWE-bench 类长程指标，否则开放权重也只是个 demo。", "link": "https://www.marktechpost.com/2026/11/20/radixark-daisyrose-27b-agentic-model/", "source": "MarkTechPost", "score": 3.6, "tags": ["大模型", "强化学习", "代码生成"], "category": "大模型", "published_at": "2026-11-20T17:42:29+00:00", "published_at_disp": "11-21 01:42"}, {"title": "Signal 在 iOS 27 与 Android 上屏蔽截图，阻止 AI Agent 读取私聊", "summary": "Signal 开始在 iOS 27 与 Android 上阻止截图，目的是防止 Siri AI、Google 助手等系统级 AI Agent 通过屏幕读取能力抓取私密聊天内容。该措施针对的是 OS 层新增的屏幕感知 API，Signal 选择在应用侧直接切断截图通道，具体实现机制与是否影响正常用户截图未详细说明。", "analysis": "这是端侧 Agent 时代的第一场隐私攻防：OS 把屏幕内容变成 Agent 可读的上下文，等于给所有 App 开了个后门。Signal 直接在应用层禁截图是釜底抽薪，但代价是牺牲了用户自己的截图需求。更根本的问题在于 OS 级屏幕读取权限的粒度控制——如果系统 API 不提供 per-app 的 opt-out，应用侧只能靠这种粗暴手段自保。", "link": "https://the-decoder.com/signal-blocks-screenshots-on-ios-27-and-android-to-stop-ai-agents-from-reading-private-chats/", "source": "The Decoder", "score": 3.6, "tags": ["行业动态", "AI Agent", "隐私"], "category": "行业动态", "published_at": "2026-11-20T19:50:27+00:00", "published_at_disp": "11-21 03:50"}, {"title": "OpenAI 详解对抗性蒸馏的分层防御体系", "summary": "OpenAI 发布文章介绍其对抗性蒸馏防御的分层方法，结合模型训练、系统级监控与检测手段，识别并阻断第三方通过 API 大规模套取模型输出以训练竞品的行为。文章强调这是训练与部署协同的多层策略，而非单点过滤，具体检测指标与误杀率未披露。", "analysis": "对抗性蒸馏是当下最现实的 IP 泄漏通道：拿几百万条 API 输出做 SFT，成本远低于自研。分层防御的思路合理——训练侧加水印/指纹，系统侧做行为聚类检测异常查询模式。但这类防御天然是猫鼠游戏，攻击者只要降低查询速率、混入噪声就能绕过统计检测。真正有效的还是输出侧的信息降质，代价是正常用户体验。", "link": "https://openai.com/index/combatting-adversarial-distillation", "source": "OpenAI", "score": 3.4, "tags": ["大模型", "模型安全", "蒸馏"], "category": "大模型", "published_at": "2026-11-20T10:00:00+00:00", "published_at_disp": "11-20 18:00"}, {"title": "METR 更新那张被误解最深的 AI 能力曲线图", "summary": "AI 评测非营利组织 METR 发布新报告，对其广受引用但也广受误读的能力增长曲线图做了重大更新。报告指出部分 AI 能力指标的增长形态与外界解读存在偏差，新版本调整了测量口径与时间窗口，具体指标变化与数据来源未在摘要中展开。", "analysis": "METR 那条时间跨度曲线被无数 PPT 引用成「能力指数级爆炸」的证据，这次更新大概率是在修正外推的合理性——比如任务时长翻倍周期是否被高估。对做能力预测的团队来说，测量口径比曲线形状更重要：任务定义、评分阈值、模型版本都会显著改变斜率。别拿旧图做 roadmap 了。", "link": "https://www.technologyreview.com/2026/11/20/1149399/the-most-misunderstood-graph-in-ai-just-got-a-major-update/", "source": "MIT Tech Review", "score": 3.4, "tags": ["论文与研究", "benchmark", "能力评测"], "category": "论文与研究", "published_at": "2026-11-20T18:15:15+00:00", "published_at_disp": "11-21 02:15"}, {"title": "对抗 slop 的新武器：形式化验证", "summary": "Latent Space 撰文讨论 2026 年 AI 行业的关键词「slop」——低质量 AI 生成内容泛滥，并提出形式化验证作为新兴对抗手段。文章认为随着 LLM 输出规模爆炸，靠人工审核已不可行，用 Lean 等证明助手对关键输出做机器可验证的正确性检查，是少数能规模化的质量闸门。", "analysis": "把形式化验证当 slop 过滤器，思路是对的但覆盖面有限：Lean 能验数学证明和程序正确性，验不了自然语言事实性。真正可落地的是在代码生成和数学推理这两个有明确语义的域里做 verify-then-accept，把 LLM 的不确定性收敛到可判定的子集。对多数内容场景，这条路走不通，还是得靠检索溯源和置信度校准。", "link": "https://latent.space/p/formal-verification/", "source": "Latent Space", "score": 3.3, "tags": ["论文与研究", "形式化验证"], "category": "论文与研究", "published_at": "2026-11-20T21:18:41+00:00", "published_at_disp": "11-21 05:18"}, {"title": "从计算复杂性视角理解 LLM 推理", "summary": "一篇 arXiv 论文提出用计算复杂性理论框架分析大语言模型推理，试图刻画 Transformer 前向计算在哪些问题上具备可判定性与效率边界。论文将推理任务映射到复杂性类，讨论上下文长度与计算资源对可解问题集的影响，具体理论结果未在摘要中展开。", "analysis": "把 LLM 推理塞进复杂性类是个老话题但一直缺严格结果：固定深度 Transformer 大致对应 TC0 一类，链式 CoT 相当于给模型加了多项式步数的「草稿纸」，这才是 CoT 有效的理论解释方向。这篇如果能给出上下文长度与可解问题类的定量关系，对设计推理时计算分配有指导意义。理论味重，工程落地还远。", "link": "https://arxiv.org/abs/2611.24943", "source": "ArXiv CL", "score": 3.2, "tags": ["论文与研究", "计算复杂性", "推理"], "category": "论文与研究", "published_at": "2026-11-20T05:00:00+00:00", "published_at_disp": "11-20 13:00"}, {"title": "特朗普威胁对将 AI 数据中心建到美国之外的公司征收重税", "summary": "特朗普表示将对在海外建设 AI 数据中心的公司征收「巨额税收」，以此施压企业把算力基础设施留在美国境内。该表态针对的是近期多家云厂商与模型公司在海外布局大规模训练集群的趋势，具体税率、适用范围与立法路径均未明确。", "analysis": "算力基础设施已经彻底政治化：数据中心选址不再只是电价和延迟的函数，还要算上关税风险。对做训练集群规划的团队，这意味着海外扩容的 TCO 模型要加一个政策变量。但「巨额税收」目前只是口头威胁，没有立法细节，短期内更可能影响的是资本开支的选址决策节奏，而不是立刻改变已开工的项目。", "link": "https://www.theverge.com/policy/1038892/trump-foreign-data-centers-tax", "source": "The Verge AI", "score": 3.2, "tags": ["行业动态", "算力", "政策"], "category": "行业动态", "published_at": "2026-11-20T18:50:19+00:00", "published_at_disp": "11-21 02:50"}, {"title": "研究：能力不对称下人机共生关系不稳定", "summary": "一篇 arXiv 论文从博弈与动力学角度分析人机共生（Human-AI Mutualism）的稳定性，结论是在能力不对称条件下，原本互惠的协作关系会向单方主导漂移。论文给出形式化模型刻画这种不稳定性，并讨论了对 AI 治理与协作协议设计的含义，具体实验设置未在摘要中详述。", "analysis": "把「人机共生」从口号拉进动力学模型是这篇的价值所在：能力差距越大，人类侧的反馈信号越难对 AI 行为形成有效约束，系统会滑向 AI 主导的均衡。这对 Agent 权限设计有直接含义——人类审批节点不能只是形式上的 veto，得有实质的信息优势。理论框架不错，但缺实证校准，结论偏定性。", "link": "https://arxiv.org/abs/2611.23322", "source": "ArXiv CL", "score": 3.1, "tags": ["论文与研究", "AI 治理"], "category": "论文与研究", "published_at": "2026-11-20T05:00:00+00:00", "published_at_disp": "11-20 13:00"}, {"title": "模型合并干扰的预测与校正：线性化要挑地方", "summary": "一篇 arXiv 论文研究模型合并（Model Merging）中的干扰问题，指出线性化近似在参数空间的某些区域会显著失真，并提出可预测干扰并加以校正的方法。论文给出干扰的判别准则与校正流程，目标是让合并后的模型在保持各源模型能力上更稳定，具体实验模型与指标未在摘要中详述。", "analysis": "模型合并的痛点就是任务向量之间的干扰导致能力互相覆盖，现有 TIES/DARE 这类方法靠启发式剪枝，缺理论刻画。这篇从线性化误差入手定位干扰来源，思路比拍脑袋剪枝更靠谱。关键看校正开销——如果每个合并都要跑一遍干扰预测，那在大模型上成本不低。对做多 LoRA 融合的团队有参考价值。", "link": "https://arxiv.org/abs/2611.25000", "source": "ArXiv CL", "score": 3.1, "tags": ["论文与研究", "模型合并"], "category": "论文与研究", "published_at": "2026-11-20T05:00:00+00:00", "published_at_disp": "11-20 13:00"}, {"title": "训练语言模型做内省式监督", "summary": "一篇 arXiv 论文提出训练语言模型进行内省式监督（Introspective Oversight），让模型对自身输出与内部状态做可训练的自我评估，用于提升可靠性与对齐。方法将内省能力作为训练目标而非提示技巧，论文报告了在监督信号质量上的改进，具体 benchmark 与模型规模未在摘要中给出。", "analysis": "内省监督的关键难点是 ground truth 从哪来——模型自评很容易变成自我确认偏误的闭环。如果论文是把内省作为可训练目标并配了外部验证信号，那有戏；如果只是让模型「反思一下」，那就是 CoT 换皮。需要看它在分布外任务上的校准曲线，否则自监督的可靠性提升可能只是过拟合评测集。", "link": "https://arxiv.org/abs/2611.23365", "source": "ArXiv CL", "score": 3.0, "tags": ["论文与研究", "对齐", "自监督"], "category": "论文与研究", "published_at": "2026-11-20T05:00:00+00:00", "published_at_disp": "11-20 13:00"}, {"title": "Infer3D：用逆向生成建模做鲁棒三维重建", "summary": "一篇 arXiv 论文提出 Infer3D，将三维重建表述为逆向生成建模问题，借助生成先验提升在稀疏视角与噪声输入下的鲁棒性。方法不同于传统多视图几何管线，而是从生成模型反推场景结构，论文报告了在重建鲁棒性上的改进，具体数据集与指标未在摘要中给出。", "analysis": "生成先验做 3D 重建这两年很卷，从 NeRF 到 3DGS 再到 diffusion prior，Infer3D 的差异点在于「逆向」——不是先生成再拟合，而是把重建直接写成生成模型的逆问题。稀疏视角下这确实能补几何歧义，但生成先验会引入幻觉几何，评测里得看 Chamfer distance 之外的结构一致性指标，否则重建出来的东西好看但不对。", "link": "https://arxiv.org/abs/2611.25061", "source": "ArXiv CL", "score": 3.0, "tags": ["论文与研究", "三维重建", "生成模型"], "category": "论文与研究", "published_at": "2026-11-20T05:00:00+00:00", "published_at_disp": "11-20 13:00"}, {"title": "进展：AWS Quick 更新：更强的 flow、新 Web 体验与协同 Agent", "summary": "AWS 为 Quick 推出更新，新增更强大的 flow 编排能力、改版 Web 体验，以及可相互协作的 Agent。官方定位是把个人流程沉淀为团队流程，让多个 Agent 在同一工作流中分工协作，具体 Agent 通信机制与可用区域未在摘要中说明。", "analysis": "多 Agent 协作是今年云厂商的标配叙事，但「Agent 之间能协作」和「协作得对」是两回事——没有共享状态管理和冲突消解，多 Agent 只会放大错误。AWS 的优势是能直接挂 IAM 和事件总线，权限与审计链路天然完整。要看它有没有暴露 Agent 间消息的 schema，否则就是个可视化编排壳。", "link": "https://aws.amazon.com/blogs/machine-learning/new-in-aws-quick-more-capable-flows-an-updated-web-experience-and-agents-that-work-together/", "source": "AWS ML Blog", "score": 3.0, "tags": ["Agent框架", "AWS", "工作流"], "category": "Agent框架", "published_at": "2026-11-21T01:06:42+00:00", "published_at_disp": "11-21 09:06"}, {"title": "Hebbia 用 GPT-6 Astra 做金融研究，预发布评测显示改进", "summary": "Hebbia 对 GPT-6 Astra 在金融研究场景做了预发布评测，结果显示其在文档检索、跨报告综合与引用准确性上较前代有提升。Hebbia 的产品形态是基于多文档的 Agentic 研究工作流，此次评测聚焦长上下文下的财务数据抽取与结论溯源，具体 benchmark 分值未在摘要中给出。", "analysis": "金融研究是长上下文 + 高引用准确率的双重压力测试场，比通用 QA 更能暴露模型在数字幻觉上的短板。客户案例本质是 OpenAI 的软广，但 Hebbia 这类 RAG-over-10-K 的工作流确实是 GPT-6 长上下文能力的真实试金石。关键看引用准确率能不能压到可审计水平，否则金融合规这关过不去。", "link": "https://openai.com/business/customer-stories/hebbia", "source": "OpenAI", "score": 2.9, "tags": ["产品与发布", "RAG", "金融"], "category": "产品与发布", "published_at": "2026-11-20T00:00:00+00:00", "published_at_disp": "11-20 08:00"}, {"title": "EgoPas             <div class="card-title">${escH(decorateTitle(item.title))}</div>
            <div class="card-summary">${renderSummary(item.summary)}</div>
            ${item.analysis ? renderAnalysis(item.analysis, ANALYSIS_LABELS[__STYLE_NAME__]) : ''}
            <div class="card-bottom">
              <a class="card-link" href="${safeHref(item.link)}" target="_blank" rel="noopener noreferrer">阅读原文</a>
              <div class="card-right">
                ${item.footnote ? `<span class="footnote">${escH(item.footnote)}</span>` : ''}
                ${item.score > 0 ? `<span class="score-badge ${item.score >= 4 ? 'high' : item.score >= 3 ? 'mid' : 'low'}">${Number(item.score).toFixed(1)}</span>` : ''}
              </div>
            </div>
          `;
        return card;
      }

      btn.disabled = true;
      list.innerHTML = '';
      list.classList.remove('visible');
      ac.classList.remove('visible');
      empty.classList.remove('visible');
      loading.classList.add('visible');

      setTimeout(() => {
        loading.classList.remove('visible');

        if (!__NEWS_DATA__ || __NEWS_DATA__.length === 0) {
          empty.classList.add('visible');
          btn.disabled = false;
          return;
        }

        // 按分类分组（category 字段为分类键，回退到 tags[0]）
        const groups = {};
        const CATEGORY_ORDER = ['大模型', 'Agent框架', '产品与发布', '论文与研究', '行业动态', '其他动态'];
        __NEWS_DATA__.forEach(item => {
          const cat = (item.category) || (item.tags && item.tags[0]) || '其他动态';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        });

        // 合并条目 < 2 的零散分类到「其他动态」，避免板块过于分散
        Object.keys(groups).forEach(cat => {
          if (cat === '其他动态') return;
          if (groups[cat].length < 2) {
            groups['其他动态'] = (groups['其他动态'] || []).concat(groups[cat]);
            delete groups[cat];
          }
        });

        // 按固定顺序渲染分类区块
        let globalIndex = 0;
        CATEGORY_ORDER.forEach(cat => {
          if (!groups[cat]) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        // 处理不在 CATEGORY_ORDER 中的分类
        Object.keys(groups).forEach(cat => {
          if (CATEGORY_ORDER.includes(cat)) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        list.classList.add('visible');

        // 项目推荐（本周热门学习项目）
        const projCard = document.getElementById('projects-card');
        if (projCard && __PROJECTS__ && __PROJECTS__.length) {
          const pHeader = document.createElement('div');
          pHeader.className = 'category-header';
          pHeader.textContent = `🚀 本周热门学习项目（${__PROJECTS__.length}条）`;
          projCard.appendChild(pHeader);
          __PROJECTS__.forEach(p => {
            const pc = document.createElement('div');
            pc.className = 'news-card';
            pc.innerHTML = `
              <div class="card-title"><a href="${safeHref(p.link)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;border-bottom:1px solid #1a1a1a;">${escH(p.name)}</a></div>
              <div class="card-summary">${escH(p.desc || '')}</div>
              <div class="card-meta">
                ${p.tag ? `<span class="tag-tag">${escH(p.tag)}</span>` : ''}
                ${p.stars ? `<span class="source-tag">${escH(p.stars)}</span>` : ''}
              </div>
            `;
            projCard.appendChild(pc);
          });
          projCard.classList.add('visible');
        }

        // 更多要闻（未进正文的条目，压缩为简讯）
        const briefCard = document.getElementById('briefs-card');
        if (briefCard && __BRIEFS__ && __BRIEFS__.length) {
          const bHeader = document.createElement('div');
          bHeader.className = 'category-header';
          bHeader.textContent = `📌 更多要闻（${__BRIEFS__.length}条）`;
          briefCard.appendChild(bHeader);
          __BRIEFS__.forEach(b => {
            const row = document.createElement('div');
            row.className = 'brief-row';
            const titleHtml = b.link
              ? `<a href="${safeHref(b.link)}" target="_blank" rel="noopener noreferrer">${escH(b.title)}</a>`
              : escH(b.title);
            row.innerHTML = `<div class="brief-title">${titleHtml}</div>` +
                            `<div class="brief-text">${escH(b.brief || '')}</div>`;
            briefCard.appendChild(row);
          });
          briefCard.classList.add('visible');
        }

        // 深度分析
        if (__DAILY_ANALYSIS__) {
          document.getElementById('analysis-content').innerHTML = renderSummary(__DAILY_ANALYSIS__);
          ac.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = '🔄 刷新';
      }, 800);
    }

    window.addEventListener('DOMContentLoaded', generateBriefing);
  </script>

</body>
</html>
