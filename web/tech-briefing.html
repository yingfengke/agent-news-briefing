 3.9, "tags": ["行业动态", "数据安全", "Qwen"], "category": "行业动态", "published_at": "2026-10-27T19:45:49+00:00", "published_at_disp": "10-28 03:45"}, {"title": "Liquid AI 发布 LFM3：6 个 2B 级开源权重多模态模型", "summary": "Liquid AI 推出新一代 Liquid Foundation Models 系列 LFM3，共 6 个开源权重模型，均属 2B 参数级别并支持多模态输入。官方定位为端侧与低算力场景，延续其非 Transformer 的液态网络架构路线，具体 benchmark 分数与许可证条款原文未完整披露。", "analysis": "2B 级多模态 + 开源权重，摆明了抢端侧推理的坑位。Liquid 的卖点是线性复杂度架构在长序列上的推理成本优势，但 2B 这个量级做多模态，视觉编码器一挂上去实际有效参数就更紧张了，OCR、图表理解这类任务大概率打不过 7B 以上的 VLM。真正值得看的是它的 prefill 吞吐和首 token 延迟曲线——如果线性架构在 32K 上下文下能把 KV Cache 压成常数级，那在手机和车机上就有戏。", "link": "https://www.marktechpost.com/2026/10/27/liquid-ai-lfm3-open-weight-2b-multimodal-models/", "source": "MarkTechPost", "score": 3.8, "tags": ["大模型", "多模态", "开源权重"], "category": "大模型", "published_at": "2026-10-27T21:08:02+00:00", "published_at_disp": "10-28 05:08"}, {"title": "Nemotron 3.5 Bolt 74B-A9B：面向本地 AI 的 24GB 混合视觉语言模型", "summary": "arXiv 新论文介绍 Nemotron 3.5 Bolt 74B-A9B，采用 MoE 架构，总参数 74B、激活参数 9B，可在 24GB 显存条件下本地运行，定位为混合视觉语言模型。该设计通过稀疏激活把推理显存需求压到单张消费级显卡可承载的范围。", "analysis": "74B 总参数、9B 激活、24GB 显存能跑，这组数字说明它把专家层做了量化或 offload 处理，本质是用存储换显存。9B 激活意味着每 token 的 FLOPs 接近 9B 稠密模型，推理速度不会太难看，但 MoE 的专家路由在视觉 token 上容易负载不均，batch 一大就可能出现长尾延迟。24GB 这个门槛卡得很准，正好是 4090 的甜点位。", "link": "https://arxiv.org/abs/2610.33039", "source": "ArXiv CV", "score": 3.6, "tags": ["论文与研究", "MoE", "端侧推理"], "category": "论文与研究", "published_at": "2026-10-27T04:00:00+00:00", "published_at_disp": "10-27 12:00"}, {"title": "开发者实践：为什么 Agent 护栏 Prompt 挡不住 Prompt Injection", "summary": "DEV.to 技术文章分析 AI Agent 护栏 Prompt 在 Prompt Injection 攻击下失效的原因，指出护栏 Prompt 本质只是「建议」而非强制约束，攻击者可通过注入覆盖。文章提出用预确定性的 ACP 真值表机制替代自然语言护栏，把权限判定从模型层下沉到确定性逻辑层。", "analysis": "这个判断是对的：用 LLM 去守 LLM，等于把安全边界建在沙子上。护栏 Prompt 在对抗性输入下就是纸糊的，ACP 真值表这类确定性策略引擎才是正路——把工具调用权限做成可枚举的状态机，模型只能在合法转移里选。坑在于真值表的组合爆炸，工具一多状态空间就压不住，得配合能力令牌做收敛。", "link": "https://dev.to/firstpageseollclgtm/why-ai-agent-guardrail-prompts-fail-under-prompt-injection-and-how-pre-deterministic-acp-truth-8ne", "source": "DEV.to AI", "score": 3.5, "tags": ["Agent框架", "Prompt Injection", "安全"], "category": "Agent框架", "published_at": "2026-10-28T01:29:01+00:00", "published_at_disp": "10-28 09:29"}, {"title": "Reddit 热议：AI 代写评审让论文评审流程进入危急状态", "summary": "r/MachineLearning 热帖讨论论文评审流程的恶化，作者指出收到的评审意见中大量出现 AI 生成痕迹，同时投稿论文本身也充斥 AI 写作，形成双向污染。帖子引发社区对评审质量、责任归属与会议治理机制的广泛讨论，具体涉及会议与数据原文未披露。", "analysis": "这是 AI 反噬学术生产链的典型闭环：作者用 LLM 灌水投稿，评审用 LLM 敷衍打分，最后双方都在跟幻觉对话。技术上无解，因为检测 AI 文本的假阳性和假阴性都高得离谱。真正的出路在流程侧——强制评审给出可验证的具体证据、引入 rebuttal 阶段的交叉质询，而不是继续堆检测工具。", "link": "https://www.reddit.com/r/MachineLearning/comments/1xh2wzt/the_paper_reviewing_process_is_now_in_critical/", "source": "Reddit ML", "score": 3.4, "tags": ["行业动态", "学术评审", "AI 生成内容"], "category": "行业动态", "published_at": "2026-10-27T19:55:31+00:00", "published_at_disp": "10-28 03:55"}, {"title": "Vercel 与 ElevenLabs 合作，14 个语音模型接入 AI Gateway", "summary": "Vercel 宣布与 ElevenLabs 达成合作，将 ElevenLabs 的 14 个语音模型接入 Vercel AI Gateway，开发者可通过统一网关调用 TTS 与语音相关能力，无需单独管理各家 API Key 与计费。此举扩展了 AI Gateway 在多模态、尤其是语音合成方向上的模型覆盖。", "analysis": "AI Gateway 这类中间层的价值就在于把多供应商的鉴权、限流、计费和 fallback 收敛成一个 endpoint。14 个 ElevenLabs 模型一次性接入，对做语音 Agent 的团队是实打实的省事——切换 voice 或降级到便宜模型只改一个 model 字符串。坑在于网关层会引入额外一跳延迟，实时语音对话场景下这几十毫秒得算进端到端预算里。", "link": "https://vercel.com/blog/elevenlabs-on-ai-gateway", "source": "Vercel News", "score": 3.3, "tags": ["产品与发布", "AI Gateway", "TTS"], "category": "产品与发布", "published_at": "2026-10-27T07:00:00+00:00", "published_at_disp": "10-27 15:00"}, {"title": "Anthropic IPO 在即，亚马逊持股收益或远超风投", "summary": "TechCrunch 报道 Anthropic IPO 将让风投机构获得数十亿美元回报，但大规模债转股披露显示亚马逊的实际持股比例更高，其潜在收益远超各家 VC。报道聚焦 Anthropic 股权结构与 IPO 后的利益分配，具体持股比例与估值数字原文未完整给出。", "analysis": "这条的信息价值在股权结构而非技术：债转股把亚马逊从「云供应商 + 战略投资」变成了最大单一受益方，意味着 Anthropic 的算力采购和资本绑定会更深。对开发者而言，值得关注的是 IPO 后 Anthropic 的定价策略会不会因为财报压力转向——企业 API 涨价或配额收紧都是可能的连锁反应。", "link": "https://techcrunch.com/2026/10/27/vcs-will-make-billions-on-anthropics-ipo-but-amazon-is-set-to-make-much-much-more/", "source": "TechCrunch AI", "score": 3.3, "tags": ["行业动态", "Anthropic", "IPO"], "category": "行业动态", "published_at": "2026-10-28T01:15:28+00:00", "published_at_disp": "10-28 09:15"}, {"title": "研究：多模态 Agent 的自适应双记忆机制 Intuition with Evidence", "summary": "arXiv 新论文提出面向多模态 Agent 的自适应双记忆框架，将直觉式快速记忆与证据式可追溯记忆分离管理，让 Agent 在长程多模态任务中动态调度两类记忆。论文声称该机制能改善多模态 Agent 在长序列交互中的信息保持与推理一致性，具体 benchmark 提升幅度原文摘要未给出。", "analysis": "双记忆这套思路和人类认知里的 System 1/System 2 对应，工程上就是把 KV Cache 分成快慢两层：快层存近期高置信度表征，慢层存可检索的证据片段。方向对，但多模态 Agent 的记忆管理真正的坑在跨模态对齐——视觉 token 和文本 token 的记忆淘汰策略不能共用一套 LRU。论文没在摘要里放数字，等看实验部分再说。", "link": "https://arxiv.org/abs/2610.33019", "source": "ArXiv CV", "score": 3.2, "tags": ["论文与研究", "多模态 Agent", "记忆机制"], "category": "论文与研究", "published_at": "2026-10-27T04:00:00+00:00", "published_at_disp": "10-27 12:00"}, {"title": "AWS 为 SageMaker AI 推出 SOCI 索引镜像，加速深度学习任务启动", "summary": "AWS 宣布为 SageMaker AI 任务提供 SOCI（Seekable OCI）索引镜像支持，通过按需拉取容器镜像层来缩短深度学习容器的下载与启动时间，减少任务在镜像拉取阶段的等待。该能力面向训练与推理作业的冷启动优化，具体加速比例原文未给出统一数字。", "analysis": "深度学习容器的镜像动辄几个 GB，冷启动时全量拉取是纯浪费——SOCI 做的是 lazy loading，只拉真正要执行的层，对频繁起停的推理端点和短训练任务收益明显。这属于典型的 infra 优化，不改变模型能力但直接砍掉排队时间。要注意的是它依赖镜像构建阶段生成索引，老镜像得重新 build 才能吃到红利。", "link": "https://aws.amazon.com/blogs/machine-learning/announcing-soci-indexed-images-for-faster-sagemaker-ai-jobs/", "source": "AWS ML Blog", "score": 3.1, "tags": ["产品与发布", "SageMaker", "推理基础设施"], "category": "产品与发布", "published_at": "2026-10-27T17:00:39+00:00", "published_at_disp": "10-28 01:00"}, {"title": "Vercel Plugin 上线 OpenCode，提供按需上下文能力", "summary": "Vercel 宣布其 Plugin 已在 OpenCode 中可用，该插件为编码 Agent 提供按需拉取的上下文能力，让 Agent 在编码过程中动态获取项目相关信息而非一次性塞满上下文窗口。具体支持的上下文类型与调用方式原文未完整披露。", "analysis": "编码 Agent 的核心矛盾是上下文窗口再大也不够用，按需检索才是正解。Vercel Plugin 走的是工具调用路线，把「需要什么再拿什么」做成插件，理论上能显著降低 token 消耗和首轮 prefill 成本。实际效果取决于检索精度——拿错上下文比不拿更糟，会直接把 Agent 带进幻觉分支。", "link": "https://vercel.com/changelog/vercel-plugin-now-available-in-opencode", "source": "Vercel News", "score": 3.0, "tags": ["Agent框架", "编码 Agent", "上下文管理"], "category": "Agent框架", "published_at": "2026-10-27T00:00:00+00:00", "published_at_disp": "10-27 08:00"}, {"title": "研究：ASR 微调中的智能子集选择策略 Whispering Wisely", "summary": "arXiv 新论文针对自动语音识别模型的微调数据效率问题，提出一种智能子集选择方法，从大规模语音标注数据中挑选高价值样本用于 ASR 微调，以降低标注与训练成本。论文称该策略能在减少训练数据量的同时维持识别性能，具体 WER 变化与数据缩减比例原文摘要未完整给出。", "analysis": "ASR 微调的数据选择长期靠启发式规则，这篇把它做成可学习的子集筛选，思路和主动学习一脉相承。关键指标是 WER 掉多少、数据砍多少——如果砍掉 70% 数据 WER 只涨 0.3 个点，那对垂直领域 ASR 定制是刚需。风险在于子集选择本身可能引入领域偏置，在口音和噪声场景下泛化会崩。", "link": "https://arxiv.org/abs/2610.32997", "source": "ArXiv CV", "score": 2.9, "tags": ["论文与研究", "ASR", "数据效率"], "category": "论文与研究", "published_at": "2026-10-27T04:00:00+00:00", "published_at_disp": "10-27 12:00"}, {"title": "钛动科技发布 Pro-Agent 产品 Navos Pro，主打结果导向的 AI for Work", "summary": "钛动科技在 2026 TGC 科技增长大会上发布行业首个 Pro-Agent 产品 Navos Pro，定位结果导向的 AI for Work，面向企业营销与增长场景。官方称该产品以交付结果而非对话过程为核心指标，具体模型底座、Agent 架构与性能数据原文未披露。", "analysis": "「结果导向」这个词在 Agent 赛道已经被用烂了，关键看它怎么定义和验证结果——如果只是把营销投放的 ROI 挂上去，那本质还是工作流自动化套壳。Pro-Agent 若真能做到任务级自主规划加结果自校验，才算跨过 demo 到生产的坎。目前没有模型底座和架构细节，先按营销叙事看待。", "link": "https://www.qbitai.com/2026/10/505580.html", "source": "量子位", "score": 2.9, "tags": ["产品与发布", "Agent", "企业应用"], "category": "产品与发布", "published_at": "2026-10-27T03:23:55+00:00", "published_at_disp": "10-27 11:23"}, {"title": "EKT-Router：面向具身视觉语言模型的专家证据对齐路由", "summary": "arXiv 新论文提出 EKT-Router，为具身视觉语言模型设计专家证据对齐的路由机制，在多个专家模块间按证据一致性动态分配计算。该方法面向具身场景下的多任务推理，旨在缓解专家路由与视觉证据脱节的问题，具体性能提升数据原文摘要未完整给出。", "analysis": "具身 VLM 的 MoE 路由如果只看 token 表征不看视觉证据，就会出现「用错专家」的经典翻车。EKT-Router 把证据对齐塞进路由决策，方向合理，但代价是路由本身变重——每 token 多一次证据匹配，推理延迟会涨。具身场景对实时性极敏感，这个开销能不能被精度收益覆盖，得看实机部署数据。", "link": "https://arxiv.org/abs/2610.33044", "source": "ArXiv CV", "score": 2.8, "tags": ["论文与研究", "具身智能", "MoE"], "category": "论文与研究", "published_at": "2026-10-27T04:00:00+00:00", "published_at_disp": "10-27 12:00"}, {"title": "IRON-Meme：在线梗叙事中身份与角色结构化理解基准", "summary": "arXiv 新论文发布 IRON-Meme 基准，用于评测模型对在线梗图中身份与角色叙事的结构化理解能力，覆盖多模态内容中的身份识别与角色关系抽取。该基准面向社交媒体极化背景下的内容理解任务，具体数据规模与评测结果原文摘要未完整给出。", "analysis": "梗图理解是 V     const __BRIEFS__ = [{"title": "研究：用逆向建模设计惯性约束聚变中的激光脉冲波形", "brief": "新论文用逆向建模设计惯性约束聚变激光脉冲波形", "link": "https://arxiv.org/abs/2610.33096"}, {"title": "研究：协作式上下文学习用于室内无线电地图估计", "brief": "新论文用协作式上下文学习提升室内无线电地图估计精度", "link": "https://arxiv.org/abs/2610.31702"}, {"title": "AWS 获评 2026 Gartner 联络中心即服务魔力象限领导者", "brief": "AWS 在 2026 Gartner CCaaS 魔力象限中获评领导者", "link": "https://aws.amazon.com/blogs/machine-learning/aws-named-a-leader-in-the-2026-gartner-magic-quadrant-for-contact-center-as-a-service/"}, {"title": "MIT Tech Review：工业智能是制造业的下一个增长机会", "brief": "MIT Tech Review 认为工业智能是制造业增长机会", "link": "https://www.technologyreview.com/2026/10/27/1147142/industrial-intelligence-the-next-growth-opportunity-for-manufacturing/"}, {"title": "综述：通往 NDE 4.0 的自主检测算法与策略", "brief": "综述梳理 NDE 4.0 自主检测算法与策略", "link": "https://arxiv.org/abs/2610.31704"}, {"title": "MIT Tech Review 每日简报：Anthropic IPO、智能电网与运动药丸", "brief": "MIT Tech Review 汇总 Anthropic IPO、智能电网与运动药丸", "link": "https://www.technologyreview.com/2026/10/27/1147693/the-download-anthropic-ipo-smarter-power-grids-exercise-pills/"}];;

    // 当日风格名（由 generate_briefing.py 注入，用于按风格渲染摘要）
    const __STYLE_NAME__ = "\u6781\u5ba2\u89c2\u70b9";

    // 渲染简报
    function generateBriefing() {
      const btn     = document.querySelector('.btn-generate');
      const loading = document.getElementById('loading');
      const list    = document.getElementById('news-list');
      const empty   = document.getElementById('empty-state');
      const ac      = document.getElementById('analysis-card');

      // 摘要渲染：先 HTML 转义（防 XSS），删冗余注记，再按当日风格分发给专属渲染函数
      // （各风格只处理自己的分析结构，避免统一正则漏词）
      function metaFrag() { return '<br/><span class="meta-frag">'; }
      function labelFrag() { return '<br/><span class="frag-label">'; }
      function renderDefault(s) {
        return s.replace(/(（[^（）]{0,40}?(?:报道|交叉验证|作者|by)[^（）]{0,40}）)/g, metaFrag() + '$1</span>');
      }
      function renderPM(s) {
        s = s.replace(/((?:用户价值|商业模式|竞争格局)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderWeibo(s) {
        s = s.replace(/((?:网友[A-Za-z一二三四五六七八九十]{0,2}?)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      // 微博热度标记补 emoji：提示词已要求模型直接输出，模型漏加时渲染层兜底补齐
      const WEIBO_HEAT_MARKS = { '爆': '🔥爆', '沸': '🔥沸', '热': '📈热' };
      function decorateTitle(t) {
        if (__STYLE_NAME__ !== '微博热搜') return t;
        const s = String(t || '');
        return WEIBO_HEAT_MARKS[s[0]] ? WEIBO_HEAT_MARKS[s[0]] + s.slice(1) : s;
      }
      function renderPractical(s) {
        s = s.replace(/((?:落地要点)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderParagraph(s) {
        const parts = s.split(/\n+/);
        if (parts.length <= 1) return renderDefault(s);
        const head = parts[0].trim();
        const tail = parts.slice(1).map(p => p.trim()).filter(Boolean).join('<br/>');
        if (!tail) return renderDefault(s);
        return renderDefault(head) + '<br/><span class="meta-frag">' + renderDefault(tail) + '</span>';
      }
      // 深度解读/极客观点为段落式风格：分割器产出 analysis 字段，灰字独立成段展示
      const STYLE_RENDERERS = { '产品经理': renderPM, '微博热搜': renderWeibo, '工程实战派': renderPractical, '深度解读': renderParagraph, '极客观点': renderParagraph };
      function renderSummary(s) {
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const cleaned = esc
          .replace(/（(?:真需求|伪需求|商业模式存疑|卷但没用|值得抄)）/g, '')
          .replace(/（来源：[^（）、,，]{1,40}）/g, '');
        const renderer = STYLE_RENDERERS[__STYLE_NAME__] || renderDefault;
        return renderer(cleaned);
      }
      function renderAnalysis(s, label) {
        if (!s) return '';
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const lab = (label || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const labelHtml = lab ? '<span class="analysis-label">' + lab + '</span>' : '';
        return '<div class="card-analysis">' + labelHtml + renderDefault(esc) + '</div>';
      }
      const ANALYSIS_LABELS = { '深度解读': '解读：', '极客观点': '点评：' };

      // 新闻字段来自外部 RSS / AI 输出，进入 innerHTML 前必须转义；链接仅放行 http(s)
      const escH = s => String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      const safeHref = u => /^https?:\/\//i.test(String(u || '').trim()) ? escH(String(u).trim()) : '#';

      function buildNewsCard(item, idx) {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
            <div class="card-meta">
              <span class="card-index">No.${String(idx).padStart(2, '0')}</span>
              ${item.source ? `<span class="source-tag">${escH(item.source)}</span>` : ''}${item.published_at_disp ? `<span class="source-tag" style="color:#aaa;background:#f0f0ee;">发布于 ${escH(item.published_at_disp)}</span>` : ''}${item.tags && item.tags.length ? item.tags.filter(t => t !== item.category).map(t => `<span class="tag-tag">${escH(t)}</span>`).join('') : ''}
            </div>
            <div class="card-title">${escH(decorateTitle(item.title))}</div>
            <div class="card-summary">${renderSummary(item.summary)}</div>
            ${item.analysis ? renderAnalysis(item.analysis, ANALYSIS_LABELS[__STYLE_NAME__]) : ''}
            <div class="card-bottom">
              <a class="card-link" href="${safeHref(item.link)}" target="_blank" rel="noopener noreferrer">阅读原文</a>
              <div class="card-right">
                ${item.footnote ? `<span class="footnote">${escH(item.footnote)}</span>` : ''}
                ${item.score > 0 ? `<span class="score-badge ${item.score >= 4 ? 'high' : item.score >= 3 ? 'mid' : 'low'}">${Number(item.score).toFixed(1)}</span>` : ''}
              </div>
            </div>
          `;
        return card;
      }

      btn.disabled = true;
      list.innerHTML = '';
      list.classList.remove('visible');
      ac.classList.remove('visible');
      empty.classList.remove('visible');
      loading.classList.add('visible');

      setTimeout(() => {
        loading.classList.remove('visible');

        if (!__NEWS_DATA__ || __NEWS_DATA__.length === 0) {
          empty.classList.add('visible');
          btn.disabled = false;
          return;
        }

        // 按分类分组（category 字段为分类键，回退到 tags[0]）
        const groups = {};
        const CATEGORY_ORDER = ['大模型', 'Agent框架', '产品与发布', '论文与研究', '行业动态', '其他动态'];
        __NEWS_DATA__.forEach(item => {
          const cat = (item.category) || (item.tags && item.tags[0]) || '其他动态';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        });

        // 合并条目 < 2 的零散分类到「其他动态」，避免板块过于分散
        Object.keys(groups).forEach(cat => {
          if (cat === '其他动态') return;
          if (groups[cat].length < 2) {
            groups['其他动态'] = (groups['其他动态'] || []).concat(groups[cat]);
            delete groups[cat];
          }
        });

        // 按固定顺序渲染分类区块
        let globalIndex = 0;
        CATEGORY_ORDER.forEach(cat => {
          if (!groups[cat]) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        // 处理不在 CATEGORY_ORDER 中的分类
        Object.keys(groups).forEach(cat => {
          if (CATEGORY_ORDER.includes(cat)) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        list.classList.add('visible');

        // 项目推荐（本周热门学习项目）
        const projCard = document.getElementById('projects-card');
        if (projCard && __PROJECTS__ && __PROJECTS__.length) {
          const pHeader = document.createElement('div');
          pHeader.className = 'category-header';
          pHeader.textContent = `🚀 本周热门学习项目（${__PROJECTS__.length}条）`;
          projCard.appendChild(pHeader);
          __PROJECTS__.forEach(p => {
            const pc = document.createElement('div');
            pc.className = 'news-card';
            pc.innerHTML = `
              <div class="card-title"><a href="${safeHref(p.link)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;border-bottom:1px solid #1a1a1a;">${escH(p.name)}</a></div>
              <div class="card-summary">${escH(p.desc || '')}</div>
              <div class="card-meta">
                ${p.tag ? `<span class="tag-tag">${escH(p.tag)}</span>` : ''}
                ${p.stars ? `<span class="source-tag">${escH(p.stars)}</span>` : ''}
              </div>
            `;
            projCard.appendChild(pc);
          });
          projCard.classList.add('visible');
        }

        // 更多要闻（未进正文的条目，压缩为简讯）
        const briefCard = document.getElementById('briefs-card');
        if (briefCard && __BRIEFS__ && __BRIEFS__.length) {
          const bHeader = document.createElement('div');
          bHeader.className = 'category-header';
          bHeader.textContent = `📌 更多要闻（${__BRIEFS__.length}条）`;
          briefCard.appendChild(bHeader);
          __BRIEFS__.forEach(b => {
            const row = document.createElement('div');
            row.className = 'brief-row';
            const titleHtml = b.link
              ? `<a href="${safeHref(b.link)}" target="_blank" rel="noopener noreferrer">${escH(b.title)}</a>`
              : escH(b.title);
            row.innerHTML = `<div class="brief-title">${titleHtml}</div>` +
                            `<div class="brief-text">${escH(b.brief || '')}</div>`;
            briefCard.appendChild(row);
          });
          briefCard.classList.add('visible');
        }

        // 深度分析
        if (__DAILY_ANALYSIS__) {
          document.getElementById('analysis-content').innerHTML = renderSummary(__DAILY_ANALYSIS__);
          ac.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = '🔄 刷新';
      }, 800);
    }

    window.addEventListener('DOMContentLoaded', generateBriefing);
  </script>

</body>
</html>
