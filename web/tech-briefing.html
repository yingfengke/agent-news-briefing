    const __BRIEFS__ = [{"title": "Launch HN：Simantic（YC F26）为 AI Agent 提供固件仿真", "brief": "YC F26 项目 Simantic 在 Hacker News 发布，创始人为 Ahnaf 与 Seungmin，产品…", "link": "https://news.ycombinator.com/item?id=50291116"}, {"title": "GitHub 之外的 AI 编程 Agent：GitLab、Bitbucket、Gitea 与 Forgejo", "brief": "DEV.to 文章指出多数 AI 编程 Agent 默认代码托管在 GitHub，但大量企业代码实际位于 GitLab、…", "link": "https://dev.to/aicodeops_dev/ai-coding-agents-beyond-github-gitlab-bitbucket-gitea-and-forgejo-52f6"}, {"title": "不必信仰神明也能因宗教理由豁免工作中使用 AI", "brief": "TechCrunch 报道，肯塔基大学管理人员 David Durman 近期获得了在工作中不使用 AI 的宗教豁免，其…", "link": "https://techcrunch.com/2026/10/29/you-dont-need-to-believe-in-a-god-to-get-a-religious-exemption-from-using-ai-at-work/"}, {"title": "Proton 全面押注 AI", "brief": "Hacker News 讨论帖指出 Proton 正全面转向使用 AI，社区围绕隐私产品引入 AI 的边界展开争论：一方…", "link": "https://convo.casa/@b/117525936178835007"}, {"title": "文远知行 001 号员工带队，景烁科技首轮融资数千万美元", "brief": "10 月 29 日，文远知行披露旗下子公司景烁科技首次融资进展，由文远知行 001 号员工带队，首轮融资规模达数千万美元", "link": "https://www.qbitai.com/2026/10/506281.html"}, {"title": "签名 Agent 身份上线一个月后，实际带来了什么", "brief": "DEV.to 作者在付费推广活动中复盘签名 Agent 身份机制上线一个月的实际收益，讨论可验证身份如何解决 Agent…", "link": "https://dev.to/jessica_ilands/what-a-signed-agent-identity-actually-buys-you-a-month-in-28l1"}, {"title": "The Download：AI Agent 追踪与气候反馈循环", "brief": "MIT Tech Review 的 The Download  newsletter 汇总当日要闻，重点之一是 AI A…", "link": "https://www.technologyreview.com/2026/10/29/1147830/the-download-monitoring-ai-agents-climate-feedback-loops/"}, {"title": "Vercel IP 地理定位覆盖更多访客且精度更高", "brief": "Vercel 更新 IP 地理定位能力，称现在能以更细的网络粒度解析访客位置，覆盖更多访客", "link": "https://vercel.com/changelog/improved-ip-geolocation-data"}, {"title": "StoreLocale：翻译 App Store 与 Google Play 截图中的应用界面", "brief": "Product Hunt 上线的 StoreLocale 聚焦应用商店截图的界面文案翻译，帮助开发者把 App Stor…", "link": "https://www.producthunt.com/products/storelocale"}, {"title": "Empacer：面向小企业主的语音优先助手", "brief": "Product Hunt 上的 Empacer 定位为小企业主的语音优先助手，主打用语音交互处理日常经营事务，降低不熟悉…", "link": "https://www.producthunt.     // 当日风格名（由 generate_briefing.py 注入，用于按风格渲染摘要）
    const __STYLE_NAME__ = "\u4ea7\u54c1\u7ecf\u7406";

    // 渲染简报
    function generateBriefing() {
      const btn     = document.querySelector('.btn-generate');
      const loading = document.getElementById('loading');
      const list    = document.getElementById('news-list');
      const empty   = document.getElementById('empty-state');
      const ac      = document.getElementById('analysis-card');

      // 摘要渲染：先 HTML 转义（防 XSS），删冗余注记，再按当日风格分发给专属渲染函数
      // （各风格只处理自己的分析结构，避免统一正则漏词）
      function metaFrag() { return '<br/><span class="meta-frag">'; }
      function labelFrag() { return '<br/><span class="frag-label">'; }
      function renderDefault(s) {
        return s.replace(/(（[^（）]{0,40}?(?:报道|交叉验证|作者|by)[^（）]{0,40}）)/g, metaFrag() + '$1</span>');
      }
      function renderPM(s) {
        s = s.replace(/((?:用户价值|商业模式|竞争格局)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderWeibo(s) {
        s = s.replace(/((?:网友[A-Za-z一二三四五六七八九十]{0,2}?)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      // 微博热度标记补 emoji：提示词已要求模型直接输出，模型漏加时渲染层兜底补齐
      const WEIBO_HEAT_MARKS = { '爆': '🔥爆', '沸': '🔥沸', '热': '📈热' };
      function decorateTitle(t) {
        if (__STYLE_NAME__ !== '微博热搜') return t;
        const s = String(t || '');
        return WEIBO_HEAT_MARKS[s[0]] ? WEIBO_HEAT_MARKS[s[0]] + s.slice(1) : s;
      }
      function renderPractical(s) {
        s = s.replace(/((?:落地要点)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderParagraph(s) {
        const parts = s.split(/\n+/);
        if (parts.length <= 1) return renderDefault(s);
        const head = parts[0].trim();
        const tail = parts.slice(1).map(p => p.trim()).filter(Boolean).join('<br/>');
        if (!tail) return renderDefault(s);
        return renderDefault(head) + '<br/><span class="meta-frag">' + renderDefault(tail) + '</span>';
      }
      // 深度解读/极客观点为段落式风格：分割器产出 analysis 字段，灰字独立成段展示
      const STYLE_RENDERERS = { '产品经理': renderPM, '微博热搜': renderWeibo, '工程实战派': renderPractical, '深度解读': renderParagraph, '极客观点': renderParagraph };
      function renderSummary(s) {
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const cleaned = esc
          .replace(/（(?:真需求|伪需求|商业模式存疑|卷但没用|值得抄)）/g, '')
          .replace(/（来源：[^（）、,，]{1,40}）/g, '');
        const renderer = STYLE_RENDERERS[__STYLE_NAME__] || renderDefault;
        return renderer(cleaned);
      }
      function renderAnalysis(s, label) {
        if (!s) return '';
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const lab = (label || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const labelHtml = lab ? '<span class="analysis-label">' + lab + '</span>' : '';
        return '<div class="card-analysis">' + labelHtml + renderDefault(esc) + '</div>';
      }
      const ANALYSIS_LABELS = { '深度解读': '解读：', '极客观点': '点评：' };

      // 新闻字段来自外部 RSS / AI 输出，进入 innerHTML 前必须转义；链接仅放行 http(s)
      const escH = s => String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      const safeHref = u => /^https?:\/\//i.test(String(u || '').trim()) ? escH(String(u).trim()) : '#';

      function buildNewsCard(item, idx) {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
            <div class="card-meta">
              <span class="card-index">No.${String(idx).padStart(2, '0')}</span>
              ${item.source ? `<span class="source-tag">${escH(item.source)}</span>` : ''}${item.published_at_disp ? `<span class="source-tag" style="color:#aaa;background:#f0f0ee;">发布于 ${escH(item.published_at_disp)}</span>` : ''}${item.tags && item.tags.length ? item.tags.filter(t => t !== item.category).map(t => `<span class="tag-tag">${escH(t)}</span>`).join('') : ''}
            </div>
            <div class="card-title">${escH(decorateTitle(item.title))}</div>
            <div class="card-summary">${renderSummary(item.summary)}</div>
            ${item.analysis ? renderAnalysis(item.analysis, ANALYSIS_LABELS[__STYLE_NAME__]) : ''}
            <div class="card-bottom">
              <a class="card-link" href="${safeHref(item.link)}" target="_blank" rel="noopener noreferrer">阅读原文</a>
              <div class="card-right">
                ${item.footnote ? `<span class="footnote">${escH(item.footnote)}</span>` : ''}
                ${item.score > 0 ? `<span class="score-badge ${item.score >= 4 ? 'high' : item.score >= 3 ? 'mid' : 'low'}">${Number(item.score).toFixed(1)}</span>` : ''}
              </div>
            </div>
          `;
        return card;
      }

      btn.disabled = true;
      list.innerHTML = '';
      list.classList.remove('visible');
      ac.classList.remove('visible');
      empty.classList.remove('visible');
      loading.classList.add('visible');

      setTimeout(() => {
        loading.classList.remove('visible');

        if (!__NEWS_DATA__ || __NEWS_DATA__.length === 0) {
          empty.classList.add('visible');
          btn.disabled = false;
          return;
        }

        // 按分类分组（category 字段为分类键，回退到 tags[0]）
        const groups = {};
        const CATEGORY_ORDER = ['大模型', 'Agent框架', '产品与发布', '论文与研究', '行业动态', '其他动态'];
        __NEWS_DATA__.forEach(item => {
          const cat = (item.category) || (item.tags && item.tags[0]) || '其他动态';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        });

        // 合并条目 < 2 的零散分类到「其他动态」，避免板块过于分散
        Object.keys(groups).forEach(cat => {
          if (cat === '其他动态') return;
          if (groups[cat].length < 2) {
            groups['其他动态'] = (groups['其他动态'] || []).concat(groups[cat]);
            delete groups[cat];
          }
        });

        // 按固定顺序渲染分类区块
        let globalIndex = 0;
        CATEGORY_ORDER.forEach(cat => {
          if (!groups[cat]) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        // 处理不在 CATEGORY_ORDER 中的分类
        Object.keys(groups).forEach(cat => {
          if (CATEGORY_ORDER.includes(cat)) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        list.classList.add('visible');

        // 项目推荐（本周热门学习项目）
        const projCard = document.getElementById('projects-card');
        if (projCard && __PROJECTS__ && __PROJECTS__.length) {
          const pHeader = document.createElement('div');
          pHeader.className = 'category-header';
          pHeader.textContent = `🚀 本周热门学习项目（${__PROJECTS__.length}条）`;
          projCard.appendChild(pHeader);
          __PROJECTS__.forEach(p => {
            const pc = document.createElement('div');
            pc.className = 'news-card';
            pc.innerHTML = `
              <div class="card-title"><a href="${safeHref(p.link)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;border-bottom:1px solid #1a1a1a;">${escH(p.name)}</a></div>
              <div class="card-summary">${escH(p.desc || '')}</div>
              <div class="card-meta">
                ${p.tag ? `<span class="tag-tag">${escH(p.tag)}</span>` : ''}
                ${p.stars ? `<span class="source-tag">${escH(p.stars)}</span>` : ''}
              </div>
            `;
            projCard.appendChild(pc);
          });
          projCard.classList.add('visible');
        }

        // 更多要闻（未进正文的条目，压缩为简讯）
        const briefCard = document.getElementById('briefs-card');
        if (briefCard && __BRIEFS__ && __BRIEFS__.length) {
          const bHeader = document.createElement('div');
          bHeader.className = 'category-header';
          bHeader.textContent = `📌 更多要闻（${__BRIEFS__.length}条）`;
          briefCard.appendChild(bHeader);
          __BRIEFS__.forEach(b => {
            const row = document.createElement('div');
            row.className = 'brief-row';
            const titleHtml = b.link
              ? `<a href="${safeHref(b.link)}" target="_blank" rel="noopener noreferrer">${escH(b.title)}</a>`
              : escH(b.title);
            row.innerHTML = `<div class="brief-title">${titleHtml}</div>` +
                            `<div class="brief-text">${escH(b.brief || '')}</div>`;
            briefCard.appendChild(row);
          });
          briefCard.classList.add('visible');
        }

        // 深度分析
        if (__DAILY_ANALYSIS__) {
          document.getElementById('analysis-content').innerHTML = renderSummary(__DAILY_ANALYSIS__);
          ac.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = '🔄 刷新';
      }, 800);
    }

    window.addEventListener('DOMContentLoaded', generateBriefing);
  </script>
