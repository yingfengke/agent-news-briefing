    const __NEWS_DATA__ = [{"title": "字节跳动与港大开源异步强化学习后训练框架 Laminar", "summary": "香港大学与字节跳动 Seed 团队联合开源异步强化学习后训练框架 Laminar，旨在解决大规模 RL 训练中采样与训练速度不匹配导致的 GPU 空转问题。该框架将推理与训练解耦，支持异步 rollout，官方称可显著提升集群利用率，并已公开代码与文档。", "analysis": "异步 RL 的核心难点在于策略滞后（off-policy 程度）与样本效率的权衡。Laminar 把生成侧与学习侧解耦，意味着训练吞吐不再被长尾生成样本拖累，但需要重要性采样修正或更保守的裁剪策略来保证收敛。对工程团队而言，这类框架把「RL 后训练基础设施」从各家私有实现推向可复用组件，长期看会降低复现 o1 类推理模型的门槛，也会让 rollout 引擎与训练框架的接口逐渐标准化。", "link": "https://www.marktechpost.com/2026/11/24/bytedance-seed-laminar-async-rl-post-training-framework/", "source": "MarkTechPost", "score": 3.8, "tags": ["大模型", "强化学习", "开源框架"], "category": "大模型", "published_at": "2026-11-25T05:42:05+00:00", "published_at_disp": "11-25 13:42"}, {"title": "Google DeepMind 为 Antigravity 推出质谱解析技能 Mass Spec Skills", "summary": "Google DeepMind 发布 Mass Spec Skills，让使用 Google Antigravity 的科学家能够解析串联质谱数据并从谱图推断分子结构。该技能把质谱解读流程封装为可调用的 Agent 能力，面向化学与生命科学场景，官方博客给出了从谱图到结构的工作流说明。", "analysis": "把领域专用工具封装成 Agent 可调用的「技能」，是科学 AI 从通用对话走向可复现工作流的关键一步。质谱解析本身是强结构化推理任务：峰位、同位素分布与碎片模式需要与化学规则库交叉验证，单靠 LLM 容易产生看似合理却错误的分子式。这类技能的实际价值取决于底层是否接入了确定性的谱库检索与规则引擎，而非纯生成式推断。", "link": "https://deepmind.google/blog/interpreting-mass-spectra-with-google-antigravity/", "source": "Google DeepMind", "score": 3.5, "tags": ["产品与发布", "AI for Science", "Agent 技能"], "category": "产品与发布", "published_at": "2026-11-24T13:07:53+00:00", "published_at_disp": "11-24 21:07"}, {"title": "Scott Aaronson 谈 AI 数学证明产出速度已超过人类消化能力", "summary": "Scott Aaronson 在评论中表示，如今显而易见的趋势是：AI 将带来的不是针对某个具体问题的零散解法，而是成批涌现的数学证明，其产出速度已快到研究者来不及阅读和验证。他提到自己仍在消化两篇关于 P 与 NP 的证明，并讨论这对数学研究范式与同行评审机制意味着什么。", "analysis": "这条观察的技术含义在于：当形式化证明与 LLM 结合后，瓶颈从「发现猜想」转移到「验证与理解」。若证明生成速度持续超过人类审阅带宽，数学界将被迫依赖 Lean 等证明助手做机器可验证性筛选，人类角色转向提出有价值的问题与判断证明的意义。这对 AI 研究本身也有镜像效应——自动生成的训练数据与合成推理链同样面临「量增质难控」的验证危机。", "link": "https://simonwillison.net/2026/Nov/25/scott-aaronson/", "source": "Simon Willison", "score": 3.4, "tags": ["论文与研究", "AI for Science", "形式化验证"], "category": "论文与研究", "published_at": "2026-11-25T23:26:32+00:00", "published_at_disp": "11-26 07:26"}, {"title": "OpenAI 测试 Private Inference，承诺不查看企业敏感数据", "summary": "The Decoder 报道，OpenAI 正在测试名为 Private Inference 的新功能，允许企业在使用其模型处理敏感工作时，OpenAI 承诺不查看相关数据。该功能面向需要更强数据隔离保证的企业客户，具体技术实现与定价尚未完全披露。", "analysis": "企业采用生成式 AI 的核心障碍之一是数据可见性：模型提供商在推理链路上理论上可接触输入输出。Private Inference 若要在工程上成立，需要可信执行环境、端到端加密或严格的访问审计等技术支撑，而非仅靠政策承诺。对做企业 Agent 的开发者，这类能力会影响架构选型——是否把敏感数据留在自有边界内，还是依赖供应商的隔离保证。", "link": "https://the-decoder.com/openai-wants-companies-to-trust-it-with-sensitive-work-by-promising-not-to-look-at-their-data/", "source": "The Decoder", "score": 3.4, "tags": ["产品与发布", "OpenAI", "企业安全"], "category": "产品与发布", "published_at": "2026-11-25T18:22:02+00:00", "published_at_disp": "11-26 02:22"}, {"title": "Amazon 收购 Decart 的 AI 优化技术，瞄准 Trainium 软件短板", "summary": "DEV.to 文章分析 Amazon 收购 Decart 的 AI 优化技术并将团队纳入麾下的交易，认为此举意在弥补 Trainium 芯片在软件栈与编译器优化上的差距。文章指出，自研芯片的竞争力越来越取决于软件生态而非峰值算力。", "analysis": "自研加速器的真正护城河在编译器与算子库：硬件峰值指标再高，若图优化、内存调度与算子覆盖不到位，实际吞吐会被软件拖累。收购优化团队是缩短这一差距的常见路径，但整合风险在于把外部优化经验迁移到自家指令集与运行时。对使用 Trainium 的团队，短期可期待算子覆盖与编译质量改善，长期则要看是否形成类似 CUDA 的稳定抽象层。", "link": "https://dev.to/jimclydegm/amazons-decart-deal-targets-trainiums-software-gap-3djo", "source": "DEV.to AI", "score": 3.3, "tags": ["行业动态", "AI 芯片", "收购"], "category": "行业动态", "published_at": "2026-11-26T04:15:51+00:00", "published_at_disp": "11-26 12:15"}, {"title": "OpenAI 的 Thariq Shihipar 谈「革命 vs 文艺复兴」：AI 让软件廉价到可批量生产", "summary": "在 Latent Space 的访谈中，OpenAI 的 Thariq Shihipar 提出「革命 vs 文艺复兴」的框架，认为 AI 能把软件开发成本压到足以按千为单位批量产出，同时仍保留个体创造力的空间。他讨论了这一变化对产品组织、工程协作方式与软件价值评估的影响。", "analysis": "当生成成本趋近于零，稀缺资源从「写代码」转移到「筛选与判断」——这与编译器、开源包管理器出现时的历史模式一致，但速度更快。工程实践上的直接后果是：代码评审、测试覆盖与可观测性成为真正的瓶颈，Agent 生成的大量候选实现需要自动化验证管线来兜底。组织层面则会出现「一人多产」的团队结构，管理复杂度从人力转向质量门禁。", "link": "https://latent.space/p/the_revolution_vs_the_renaissance_thariq_shihipar_openai/", "source": "Latent Space", "score": 3.2, "tags": ["行业动态", "AI 编程", "软件工程"], "category": "行业动态", "published_at": "2026-11-25T22:28:01+00:00", "published_at_disp": "11-26 06:28"}, {"title": "AINews：数学证明的产出速度已超过人类阅读速度", "summary": "Latent Space 的 AINews 汇总指出，Scott Aaronson 仍在努力消化两篇关于 P 与 NP 的证明，而新的 AI 生成数学结果正以超过研究者阅读速度的节奏涌现。简报讨论了这一趋势对数学研究流程、验证工具与学术出版节奏的冲击。", "analysis": "与单条推文相比，这份简报的价值在于把「证明洪水」放进更广的 AI 研究节奏里观察：合成数据、自动定理证明与推理模型正在形成正反馈循环。工程上的启示是验证基础设施必须先行——没有机器可检查的形式化管线，产出越多噪声越大。对做评测与数据管线的团队，这意味着「验证器」本身会成为核心竞争力。", "link": "https://latent.space/p/ainews-math-proofs-are-landing-faster-than-we-can-read-them/", "source": "Latent Space", "score": 3.0, "tags": ["论文与研究", "AI for Science", "行业简报"], "category": "论文与研究", "published_at": "2026-11-25T22:23:41+00:00", "published_at_disp": "11-26 06:23"}, {"title": "OpenAI 合并 Chat 与 Work，重度用户可能更早触及用量上限", "summary": "TechCrunch 报道，OpenAI 将把 ChatGPT 的 Chat 与 Work 两种使用场景合并，并引入统一的用量计量表。公司提示重度用户可能因此更早触及使用上限，因为此前分开计量的额度将被合并计算。", "analysis": "统一计量表是产品整合的必然结果，但对开发者与重度用户意味着配额模型的变化：原先按场景隔离的额度缓冲消失，实际可用推理量取决于合并后的加权规则。这类调整通常伴随后端路由与限流策略重构，也提示依赖单一 API 额度的应用需要更精细的 token 预算与降级策略，避免在高峰时段被统一限流波及。", "link": "https://techcrunch.com/2026/11/25/openai-says-heavy-chatgpt-users-may-hit-limits-sooner-as-it-merges-chat-and-work/", "source": "TechCrunch AI", "score": 3.0, "tags": ["产品与发布", "OpenAI", "用量配额"], "category": "产品与发布", "published_at": "2026-11-25T20:03:27+00:00", "published_at_disp": "11-26 04:03"}, {"title": "Anthropic CEO Dario Amodei 称让 AI 治理社会是「坏主意」", "summary": "Anthropic CEO Dario Amodei 公开回应 Axios 的相关报道，明确表示让 AI 系统直接治理社会是「一个坏主意」，并澄清公司内部并未主张由 AI 取代人类决策。他强调 AI 应作为辅助工具增强人类判断，而非承担最终治理职责。", "analysis": "这场表态的实质是 AI 安全话语权之争：在监管机构开始把「AI 参与公共决策」纳入立法视野时，头部实验室的公开立场会直接影响合规边界。从技术治理角度看，把最终决策权保留给人类意味着系统设计上需要可解释的推荐层与明确的责任归属，而非端到端的自动化决策链。这对做政务、医疗等高 stakes 场景的 Agent 开发者是明确的架构约束信号。", "link": "https://the-decoder.com/anthropic-ceo-dario-amodei-says-letting-ai-govern-society-would-be-a-bad-idea/", "source": "The Decoder", "score": 2.9, "tags": ["行业动态", "AI 安全", "治理"], "category": "行业动态", "published_at": "2026-11-25T20:15:50+00:00", "published_at_disp": "11-26 04:15"}, {"title": "FCC 批准 SpaceX 部署最多 100 万颗数据中心卫星", "summary": "据 The             </div>
            <div class="card-title">${escH(decorateTitle(item.title))}</div>
            <div class="card-summary">${renderSummary(item.summary)}</div>
            ${item.analysis ? renderAnalysis(item.analysis, ANALYSIS_LABELS[__STYLE_NAME__]) : ''}
            <div class="card-bottom">
              <a class="card-link" href="${safeHref(item.link)}" target="_blank" rel="noopener noreferrer">阅读原文</a>
              <div class="card-right">
                ${item.footnote ? `<span class="footnote">${escH(item.footnote)}</span>` : ''}
                ${item.score > 0 ? `<span class="score-badge ${item.score >= 4 ? 'high' : item.score >= 3 ? 'mid' : 'low'}">${Number(item.score).toFixed(1)}</span>` : ''}
              </div>
            </div>
          `;
        return card;
      }

      btn.disabled = true;
      list.innerHTML = '';
      list.classList.remove('visible');
      ac.classList.remove('visible');
      empty.classList.remove('visible');
      loading.classList.add('visible');

      setTimeout(() => {
        loading.classList.remove('visible');

        if (!__NEWS_DATA__ || __NEWS_DATA__.length === 0) {
          empty.classList.add('visible');
          btn.disabled = false;
          return;
        }

        // 按分类分组（category 字段为分类键，回退到 tags[0]）
        const groups = {};
        const CATEGORY_ORDER = ['大模型', 'Agent框架', '产品与发布', '论文与研究', '行业动态', '其他动态'];
        __NEWS_DATA__.forEach(item => {
          const cat = (item.category) || (item.tags && item.tags[0]) || '其他动态';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        });

        // 合并条目 < 2 的零散分类到「其他动态」，避免板块过于分散
        Object.keys(groups).forEach(cat => {
          if (cat === '其他动态') return;
          if (groups[cat].length < 2) {
            groups['其他动态'] = (groups['其他动态'] || []).concat(groups[cat]);
            delete groups[cat];
          }
        });

        // 按固定顺序渲染分类区块
        let globalIndex = 0;
        CATEGORY_ORDER.forEach(cat => {
          if (!groups[cat]) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        // 处理不在 CATEGORY_ORDER 中的分类
        Object.keys(groups).forEach(cat => {
          if (CATEGORY_ORDER.includes(cat)) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        list.classList.add('visible');

        // 项目推荐（本周热门学习项目）
        const projCard = document.getElementById('projects-card');
        if (projCard && __PROJECTS__ && __PROJECTS__.length) {
          const pHeader = document.createElement('div');
          pHeader.className = 'category-header';
          pHeader.textContent = `🚀 本周热门学习项目（${__PROJECTS__.length}条）`;
          projCard.appendChild(pHeader);
          __PROJECTS__.forEach(p => {
            const pc = document.createElement('div');
            pc.className = 'news-card';
            pc.innerHTML = `
              <div class="card-title"><a href="${safeHref(p.link)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;border-bottom:1px solid #1a1a1a;">${escH(p.name)}</a></div>
              <div class="card-summary">${escH(p.desc || '')}</div>
              <div class="card-meta">
                ${p.tag ? `<span class="tag-tag">${escH(p.tag)}</span>` : ''}
                ${p.stars ? `<span class="source-tag">${escH(p.stars)}</span>` : ''}
              </div>
            `;
            projCard.appendChild(pc);
          });
          projCard.classList.add('visible');
        }

        // 更多要闻（未进正文的条目，压缩为简讯）
        const briefCard = document.getElementById('briefs-card');
        if (briefCard && __BRIEFS__ && __BRIEFS__.length) {
          const bHeader = document.createElement('div');
          bHeader.className = 'category-header';
          bHeader.textContent = `📌 更多要闻（${__BRIEFS__.length}条）`;
          briefCard.appendChild(bHeader);
          __BRIEFS__.forEach(b => {
            const row = document.createElement('div');
            row.className = 'brief-row';
            const titleHtml = b.link
              ? `<a href="${safeHref(b.link)}" target="_blank" rel="noopener noreferrer">${escH(b.title)}</a>`
              : escH(b.title);
            row.innerHTML = `<div class="brief-title">${titleHtml}</div>` +
                            `<div class="brief-text">${escH(b.brief || '')}</div>`;
            briefCard.appendChild(row);
          });
          briefCard.classList.add('visible');
        }

        // 深度分析
        if (__DAILY_ANALYSIS__) {
          document.getElementById('analysis-content').innerHTML = renderSummary(__DAILY_ANALYSIS__);
          ac.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = '🔄 刷新';
      }, 800);
    }

    window.addEventListener('DOMContentLoaded', generateBriefing);
  </script>

</body>
</html>
