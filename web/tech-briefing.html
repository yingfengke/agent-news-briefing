      const empty   = document.getElementById('empty-state');
      const ac      = document.getElementById('analysis-card');

      // 摘要渲染：先 HTML 转义（防 XSS），删冗余注记，再按当日风格分发给专属渲染函数
      // （各风格只处理自己的分析结构，避免统一正则漏词）
      function metaFrag() { return '<br/><span class="meta-frag">'; }
      function labelFrag() { return '<br/><span class="frag-label">'; }
      function renderDefault(s) {
        return s.replace(/(（[^（）]{0,40}?(?:报道|交叉验证|作者|by)[^（）]{0,40}）)/g, metaFrag() + '$1</span>');
      }
      function renderPM(s) {
        s = s.replace(/((?:用户价值|商业模式|竞争格局)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderWeibo(s) {
        s = s.replace(/((?:网友[A-Za-z一二三四五六七八九十]{0,2}?)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderPractical(s) {
        s = s.replace(/((?:落地要点)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderParagraph(s) {
        const parts = s.split(/\n+/);
        if (parts.length <= 1) return renderDefault(s);
        const head = parts[0].trim();
        const tail = parts.slice(1).map(p => p.trim()).filter(Boolean).join('<br/>');
        if (!tail) return renderDefault(s);
        return renderDefault(head) + '<br/><span class="meta-frag">' + renderDefault(tail) + '</span>';
      }
      // 深度解读/极客观点为段落式风格：分割器产出 analysis 字段，灰字独立成段展示
      const STYLE_RENDERERS = { '产品经理': renderPM, '微博热搜': renderWeibo, '工程实战派': renderPractical, '深度解读': renderParagraph, '极客观点': renderParagraph };
      function renderSummary(s) {
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const cleaned = esc
          .replace(/（(?:真需求|伪需求|商业模式存疑|卷但没用|值得抄)）/g, '')
          .replace(/（来源：[^（）、,，]{1,40}）/g, '');
        const renderer = STYLE_RENDERERS[__STYLE_NAME__] || renderDefault;
        return renderer(cleaned);
      }
      function renderAnalysis(s, label) {
        if (!s) return '';
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const lab = (label || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const labelHtml = lab ? '<span class="analysis-label">' + lab + '</span>' : '';
        return '<div class="card-analysis">' + labelHtml + renderDefault(esc) + '</div>';
      }
      const ANALYSIS_LABELS = { '深度解读': '解读：', '极客观点': '点评：' };

      btn.disabled = true;
      list.innerHTML = '';
      list.classList.remove('visible');
      ac.classList.remove('visible');
      empty.classList.remove('visible');
      loading.classList.add('visible');

      setTimeout(() => {
        loading.classList.remove('visible');

        if (!__NEWS_DATA__ || __NEWS_DATA__.length === 0) {
          empty.classList.add('visible');
          btn.disabled = false;
          return;
        }

        // 按分类分组（category 字段为分类键，回退到 tags[0]）
        const groups = {};
        const CATEGORY_ORDER = ['大模型', 'Agent框架', '产品与发布', '论文与研究', '行业动态', '其他动态'];
        __NEWS_DATA__.forEach(item => {
          const cat = (item.category) || (item.tags && item.tags[0]) || '其他动态';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        });

        // 合并条目 < 2 的零散分类到「其他动态」，避免板块过于分散
        Object.keys(groups).forEach(cat => {
          if (cat === '其他动态') return;
          if (groups[cat].length < 2) {
            groups['其他动态'] = (groups['其他动态'] || []).concat(groups[cat]);
            delete groups[cat];
          }
        });

        // 按固定顺序渲染分类区块
        let globalIndex = 0;
        CATEGORY_ORDER.forEach(cat => {
          if (!groups[cat]) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
            <div class="card-meta">
              <span class="card-index">No.${String(++globalIndex).padStart(2, '0')}</span>
              ${item.source ? `<span class="source-tag">${item.source}</span>` : ''}${item.published_at_disp ? `<span class="source-tag" style="color:#aaa;background:#f0f0ee;">发布于 ${item.published_at_disp}</span>` : ''}${item.tags && item.tags.length ? item.tags.filter(t => t !== item.category).map(t => `<span class="tag-tag">${t}</span>`).join('') : ''}
            </div>
            <div class="card-title">${item.title}</div>
            <div class="card-summary">${renderSummary(item.summary)}</div>
            ${item.analysis ? renderAnalysis(item.analysis, ANALYSIS_LABELS[__STYLE_NAME__]) : ''}
            <div class="card-bottom">
              <a class="card-link" href="${item.link}" target="_blank">阅读原文</a>
              <div class="card-right">
                ${item.footnote ? `<span class="footnote">${item.footnote.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>` : ''}
                ${item.score > 0 ? `<span class="score-badge ${item.score >= 4 ? 'high' : item.score >= 3 ? 'mid' : 'low'}">${Number(item.score).toFixed(1)}</span>` : ''}
              </div>
            </div>
          `;
            list.appendChild(card);
          });
        });

        // 处理不在 CATEGORY_ORDER 中的分类
        Object.keys(groups).forEach(cat => {
          if (CATEGORY_ORDER.includes(cat)) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
            <div class="card-meta">
              <span class="card-index">No.${String(++globalIndex).padStart(2, '0')}</span>
              ${item.source ? `<span class="source-tag">${item.source}</span>` : ''}${item.published_at_disp ? `<span class="source-tag" style="color:#aaa;background:#f0f0ee;">发布于 ${item.published_at_disp}</span>` : ''}${item.tags && item.tags.length ? item.tags.filter(t => t !== item.category).map(t => `<span class="tag-tag">${t}</span>`).join('') : ''}
            </div>
            <div class="card-title">${item.title}</div>
            <div class="card-summary">${renderSummary(item.summary)}</div>
            ${item.analysis ? renderAnalysis(item.analysis, ANALYSIS_LABELS[__STYLE_NAME__]) : ''}
            <div class="card-bottom">
              <a class="card-link" href="${item.link}" target="_blank">阅读原文</a>
              <div class="card-right">
                ${item.footnote ? `<span class="footnote">${item.footnote.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>` : ''}
                ${item.score > 0 ? `<span class="score-badge ${item.score >= 4 ? 'high' : item.score >= 3 ? 'mid' : 'low'}">${Number(item.score).toFixed(1)}</span>` : ''}
              </div>
            </div>
          `;
            list.appendChild(card);
          });
        });

        list.classList.add('visible');

        // 项目推荐（本周热门学习项目）
        const projCard = document.getElementById('projects-card');
        if (projCard && __PROJECTS__ && __PROJECTS__.length) {
          const pHeader = document.createElement('div');
          pHeader.className = 'category-header';
          pHeader.textContent = `本周热门学习项目（${__PROJECTS__.length}条）`;
          projCard.appendChild(pHeader);
          __PROJECTS__.forEach(p => {
            const pc = document.createElement('div');
            pc.className = 'news-card';
            pc.innerHTML = `
              <div class="card-title"><a href="${p.link}" target="_blank" style="color:inherit;text-decoration:none;border-bottom:1px solid #1a1a1a;">${p.name}</a></div>
              <div class="card-summary">${p.desc || ''}</div>
              <div class="card-meta">
                ${p.tag ? `<span class="tag-tag">${p.tag}</span>` : ''}
                ${p.stars ? `<span class="source-tag">${p.stars}</span>` : ''}
              </div>
            `;
            projCard.appendChild(pc);
          });
          projCard.classList.add('visible');
        }

        // 深度分析
        if (__DAILY_ANALYSIS__) {
          document.getElementById('analysis-content').innerHTML = renderSummary(__DAILY_ANALYSIS__);
          ac.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = '🔄 刷新';
      }, 800);
    }

    window.addEventListener('DOMContentLoaded', generateBriefing);
  </script>

</body>
</html>
