    const __NEWS_DATA__ = [{"title": "Deep Principle 发布 Hydrogen-1.0：753B 开源权重科学发现模型", "summary": "Deep Principle 发布 Hydrogen-1.0，一个面向科学发现的开放权重模型，参数量达 753B。该模型定位为科学计算与发现场景，具体训练数据构成、benchmark 表现与推理成本未在摘要中完整披露。", "analysis": "753B 开放权重是个不小的数字，但科学模型的关键不在参数量，在领域数据的覆盖深度——分子结构、材料相图、蛋白质序列这些模态的 tokenization 和评测集都和通用文本完全不同。开放权重意味着可私有化部署，对科研机构是利好；但 753B 的推理门槛摆在那，没有多卡集群基本跑不动，实际可用性要打问号。", "link": "https://www.marktechpost.com/2026/11/02/deep-principle-hydrogen-1-0-open-weight-scientific-model/", "source": "MarkTechPost", "score": 3.8, "tags": ["大模型", "科学计算", "开放权重"], "category": "大模型", "published_at": "2026-11-02T18:41:41+00:00", "published_at_disp": "11-03 02:41"}, {"title": "Zyphra 发布分层注意力 ZHA，剑指真正的次二次注意力", "summary": "Zyphra AI 开源 Zyphra Hierarchical Attention（ZHA），一种稀疏注意力方法，宣称可把注意力的计算复杂度从 O(n²) 压到真正的次二次级别，从而在长上下文场景下显著降低显存与算力开销。官方给出的实现与基准细节未在摘要中完整披露，但明确将其定位为通向超长序列建模的路径。", "analysis": "注意力复杂度是长上下文推理的硬瓶颈，O(n²) 在 128K 以上序列里直接吃掉 KV Cache 和 FLOPs 预算。ZHA 走分层稀疏路线，思路和 H-Mamba、NSA 一类工作同源，关键看两点：一是稀疏模式是否硬件友好、能否在 FlashAttention 级别的 kernel 上真正跑出加速比，二是长序列检索类 benchmark（如 RULER、LongBench）上的精度掉点。如果只是理论复杂度好看、实际 kernel 利用率拉胯，那和之前一堆线性注意力一样停在论文里。", "link": "https://www.marktechpost.com/2026/11/02/zyphra-hierarchical-attention-zha-sparse-attention/", "source": "MarkTechPost", "score": 3.6, "tags": ["论文与研究", "稀疏注意力", "长上下文"], "category": "论文与研究", "published_at": "2026-11-03T01:09:49+00:00", "published_at_disp": "11-03 09:09"}, {"title": "OpenAI 推出 Grid Protectors 计划，联手电力公司保障未来算力供电", "summary": "OpenAI 宣布 Grid Protectors Program，将与公用事业公司合作，为未来数据中心算力扩张所需的电力供应提供支持。该计划聚焦电网侧协作，具体投资规模、覆盖区域与时间表未在公告中完整披露。", "analysis": "算力扩张的瓶颈已经从 GPU 供给转向电力接入，单个 GW 级数据中心的并网排队动辄数年。OpenAI 直接和 utility 谈，本质是把基础设施前置到能源层。这条对模型能力没直接影响，但决定了未来两年训练集群能不能按时通电——比任何 benchmark 都更硬的天花板。", "link": "https://openai.com/index/grid-protectors-program", "source": "OpenAI", "score": 3.5, "tags": ["行业动态", "算力基建"], "category": "行业动态", "published_at": "2026-11-02T15:00:00+00:00", "published_at_disp": "11-02 23:00"}, {"title": "纽约时报起诉 Brave 浏览器 AI 抓取与绕过付费墙", "summary": "纽约时报联合多家出版机构对 Brave 浏览器提起诉讼，指控其 AI 抓取行为及绕过付费墙。诉讼聚焦于 Brave 在提供 AI 相关功能时对受版权保护内容的获取方式，是出版业针对 AI 数据来源发起的最新一轮法律行动。", "analysis": "付费墙绕过这个点比单纯的抓取争议更致命，因为它直接触及 DMCA 反规避条款。如果法院认定浏览器内置的 AI 摘要功能构成衍生使用，整个「浏览器即 AI 入口」的产品形态都得重做合规。对做 RAG 和爬虫管道的团队来说，robots.txt 之外的法律风险正在变成实打实的成本项。", "link": "https://www.theverge.com/tech/1024588/brave-lawsuit-ai-scraping-new-york-times", "source": "The Verge AI", "score": 3.5, "tags": ["行业动态", "版权诉讼"], "category": "行业动态", "published_at": "2026-11-02T17:51:19+00:00", "published_at_disp": "11-03 01:51"}, {"title": "别再数 token 了，开始数真正交付的东西", "summary": "MIT Tech Review 文章指出，当开发者把编码任务交给 AI Agent 时，Agent 做的远不止回答问题，而是执行多步操作并产出可交付物。文章主张评估 Agent 的指标应从 token 消耗转向实际交付成果，例如完成的任务数、合并的 PR 或修复的缺陷。", "analysis": "这是评测范式该有的转向。token 数是个成本代理指标，和产出质量几乎不相关——一个 Agent 烧 10 万 token 修好一个 bug，比烧 1 万 token 改坏三个文件强得多。真正难的是怎么定义「ship」：PR 合并率、CI 通过率、回滚率这些工程指标比任何 LLM-as-judge 都硬。", "link": "https://www.technologyreview.com/2026/11/02/1147702/stop-counting-tokens-start-counting-what-ships/", "source": "MIT Tech Review", "score": 3.4, "tags": ["Agent框架", "评测方法"], "category": "Agent框架", "published_at": "2026-11-02T13:10:32+00:00", "published_at_disp": "11-02 21:10"}, {"title": "进展：Cursor 上的假 Claude 扩展如何窃取开发者数据", "summary": "2026 年 10 月 29 日，数千名开发者安装的一个伪装成 Claude 的 Cursor 扩展被曝窃取开发者数据。该扩展以仿冒名义进入插件生态，在获得安装后读取本地开发环境中的敏感信息。事件暴露了 AI 编码工具插件供应链的审核缺口。", "analysis": "插件生态的信任模型基本是裸奔：IDE 扩展默认拿到工作区文件读写权限，等于把 .env、SSH key、云凭证全交出去。这类攻击的成本极低、收益极高，而审核靠的是人工抽查。对开发者来说，装扩展前看 publisher 验证和权限声明应该成为肌肉记忆，企业侧则得靠 allowlist 而不是黑名单。", "link": "https://dev.to/michael_hensel/how-a-fake-claude-extension-on-cursor-stole-developer-data-3nn4", "source": "DEV.to AI", "score": 3.4, "tags": ["行业动态", "供应链安全"], "category": "行业动态", "published_at": "2026-11-03T03:30:28+00:00", "published_at_disp": "11-03 11:30"}, {"title": "Legora CTO 谈为律师构建 AI：看不见数据时如何做法律 Agent", "summary": "Latent Space 访谈 Legora CTO Jacob Lauritzen，讨论为法律行业构建 AI 产品的工程挑战。核心矛盾在于 Legora 无法读取其 Agent 为律师执行的任何 trace，数据边界由律所的保密义务划定，团队必须在完全看不到运行时数据的前提下做调试与迭代。", "analysis": "这是 Agent 工程里最硬的一类约束：没有 trace 就没有可观测性，没有可观测性就只能靠离线评测和合成数据反推线上行为。法律场景还叠加了幻觉零容忍——引错判例是执业事故。解法大概率是本地化评测集 + 结构化输出约束 + 人工复核回路，而不是指望模型自己靠谱。", "link": "https://latent.space/p/building_legal_agents_when_you_cant_see_the_data_-_jacob_lauritzen_cto-of-legora/", "source": "Latent Space", "score": 3.3, "tags": ["Agent框架", "法律AI"], "category": "Agent框架"}, {"title": "高盛从交易员和银行家手中收回 AI 编码工具", "summary": "高盛正在撤回此前向交易员和银行家开放的 Claude Code、GitHub Copilot 等 AI 编码工具权限。报道未给出完整的技术性原因，但指向金融机构在内部合规、代码审计与数据边界上的收紧。此举与业界普遍推广 AI 编码助手的趋势形成反差。", "analysis": "金融机构的合规红线向来比技术收益优先：代码补全意味着源码片段出域，模型供应商的数据留存策略、SOC2 之外的金融监管要求都是硬约束。这不是模型能力问题，是数据治理问题。对做企业级 Agent 的团队是个提醒——私有化部署和审计日志不是加分项，是入场券。", "link": "https://the-decoder.com/goldman-sachs-pulls-ai-coding-tools-from-traders-and-bankers/", "source": "The Decoder", "score": 3.2, "tags": ["行业动态", "企业合规"], "category": "行业动态", "published_at": "2026-11-02T20:00:03+00:00", "published_at_disp": "11-03 04:00"}, {"title": "MIT：GPT-6 Astra 能直接修改 Qwen 权重，数学能力暴涨 6 倍", "summary": "据量子位报道，MIT 相关研究显示 GPT-6 Astra 具备直接修改 Qwen 模型权重的能力，并称这一机制使数学能力提升 6 倍，指令执行能力同步提升。报道未给出完整的实验设置与评测基准细节。", "analysis": "「直接改权重」这个说法需要极度谨慎地读——如果指的是模型输出权重编辑指令再由外部工具执行，那是 Agent 化的模型编辑流水线；如果宣称模型内部能反向传播改参数，那基本是叙事包装。数学能力 6 倍提升必须看具体 benchmark 和基线，MATH 从 20% 到 60% 和从 80% 到 95% 是两码事。这类消息在缺少论文链接时，先当 PR 看。", "link": "https://www.qbitai.com/2026/11/507322.html", "source": "量子位", "score": 3.2, "tags": ["论文与研究", "模型编辑"], "category": "论文与研究", "published_at": "2026-11-03T01:57:30+00:00", "published_at_disp": "11-03 09:57"}, {"title": "Import AI 479：Spacewar、低延迟任务与 LLM 的错位、Genie 4", "summary": "Import AI 第 479 期覆盖多个议题，包括 Spacewar 相关实验、低延迟任务与 LLM 之间的能力错位，以及 Genie 4 的进展。通讯延续其一贯风格，从 arXiv 论文与产业动态中筛选值得关注的研究线索，并给出作者判断。", "analysis": "「低延迟任务 vs LLM」这个提法值得展开：LLM 的推理链路天生带几百毫秒到数秒的延迟，对实时控制、高频交易、游戏帧级决策这类场景基本无解，除非上小模型蒸馏或投机解码。这期把这条线单独拎出来，说明社区开始认真区分「LLM 能做的事」和「LLM 该做的事」。", "link": "https://jack-clark.net/2026/11/02/import-ai-479-spacewar-low-latency-tasks-versus-llms-genie-4/", "source": "Import AI", "score": 3.1, "tags": ["论文与研究", "AI通讯"], "category": "论文与研究", "published_at": "2026-11-02T14:30:54+00:00", "published_at_disp": "11-02 22:30"}, {"title": "在 Amazon SageMaker AI 上用知识蒸馏构建高效 Agent", "summary": "AWS 博客介绍在 SageMaker AI 上通过知识蒸馏构建高效 Agent 的方法。场景设定为一个已在前沿模型上跑通的购物助手，通过蒸馏把能力迁移到更小、更便宜的模型上，以降低推理成本并提升响应速度。具体蒸馏配置与效果数据未在摘要中给出。", "analysis": "Agent 场景的蒸馏比单轮对话难，因为要迁移的是多步决策轨迹而非单点输出。常见做法是用前沿模型生成带 tool call 的完整轨迹做 SFT，再配 DPO 修掉错误分支。风险是学生模型在分布外工具调用上崩得更快，上线前得用轨迹级评测而不是单轮 accuracy 兜底。", "link": "https://aws.amazon.com/blogs/machine-learning/build-efficient-agents-with-knowledge-distillation-on-amazon-sagemaker-ai/", "source": "AWS ML Blog", "score": 3.1, "tags": ["Agent框架", "知识蒸馏"], "category": "Agent框架", "published_at": "2026-11-02T17:01:31+00:00", "published_at_disp": "11-03 01:01"}, {"title": "美国人口普查局数据与「超级智能」叙事的落差", "summary": "Simon Willison 援引美国人口普查局关于大型企业 AI 采用率呈下降趋势的数据，讨论当前 AI 采用情况与「超级智能」宏大叙事之间的落差。文章指出企业侧的实际渗透并不像宣传中那样陡峭上升，部分指标甚至回落。", "analysis": "这类一手统计数据比任何 benchmark 都更能戳破泡沫。企业采用率回落可能反映的是试点到生产的死亡谷——POC 阶段 token 便宜，真上生产后推理成本、幻觉兜底、合规审计三座山压下来，ROI 算不过来就砍预算。对做 to B Agent 的团队来说，这是比模型能力更现实的约束。", "link": "https://simonwillison.net/2026/Nov/2/census-bureau-super-intelligence/", "source": "Simon Willison", "score": 3.0, "tags": ["行业动态", "AI采用率"], "category": "行业动态", "published_at": "2026-11-02T13:31:26+00:00", "published_at_disp": "11-02 21:31"}, {"title": "用 Crawl4AI 为 Amazon Bedrock Knowledge Bases 准备网页内容", "summary": "AWS 机器学习博客介绍如何用 Crawl4AI 为 Amazon Bedrock Knowledge Bases 准备网页内容。文章指出在构建 RAG 应用时，答案质量高度依赖抓取与清洗环节，Crawl4AI 可把网页转成适合向量化的结构化文本，再灌入知识库。", "analysis": "RAG 的瓶颈从来不在检索算法，在数据管道。网页抓取的 boilerplate 去除、动态渲染、分块策略直接决定召回质量，Crawl4AI 这类工具把这块工程标准化了。坑在于分块粒度——按固定 token 切会把表格和代码块切碎，得按 DOM 结构切才有意义。", "link": "https://aws.amazon.com/blogs/machine-learning/prepare-web-content-for-amazon-bedrock-knowledge-bases-with-crawl4ai/", "source": "AWS ML Blog", "score": 3.0, "tags": ["产品与发布", "RAG"], "category": "产品与发布", "published_at": "2026-11-02T17:11:21+00:00", "published_at_disp": "11-03 01:11"}, {"title": "The Letter Company 发布 Letterpress-1：面向增长工程的编码 Agent", "summary": "The Letter Company 推出 Letterpress-1 的 beta 版，定位为面向增长工程（growth engineering）的编码 Agent，配套自研 harness。它针对的是增长团队常见的埋点、实验配置、页面迭代等重复性工程任务，而非通用软件开发。具体模型参数、benchmark 分数与定价未披露。", "analysis": "垂直化编码 Agent 是今年的明显趋势，从通用 SWE-bench 刷分转向具体岗位工作流。增长工程这个切口选得刁钻——任务短、反馈快、可 A/B 验证，天然适合 Agent 闭环。但 harness 和评测集不公开的话，很难判断它是真做了领域微调还是套壳加 prompt 模板，beta 阶段先观望。", "link": "https://www.marktechpost.com/2026/11/02/letter-letterpress-1-growth-engineering-coding-agent/", "source": "MarkTechPost", "score": 2.9, "tags": ["Agent框架", "编码Agent"], "category": "Agent框架", "published_at": "2026-11-03T00:43:03+00:00", "published_at_disp": "11-03 08:43"}, {"title": "苹果或借第三方 AI 应用寻找新营收来源", "summary": "TechCrunch 报道，苹果暗示可能通过第三方 AI 应用相关的「机会」来增加收入，但具体形式尚不明确。报道将其解读为苹果在 App Store 生态中对 AI 应用探索新的分成或合作模式。", "analysis": "苹果在 AI 上是典型的后发跟随者，自研模型能力落后于第一梯队，于是转向做渠道抽成。如果真对第三方 AI 应用加收分成或设置 API 调用门槛，会直接推高 AI 应用在 iOS 上的单位经济成本。对开发者来说，这是平台税在 AI 时代的又一次重定价。", "link": "https://techcrunch.com/2026/11/02/apple-may-try-to-increase-revenue-by-doing-something-with-third-party-ai-apps/", "source": "TechCrunch AI", "score": 2.9, "tags": ["行业动态", "平台生态"], "category": "行业动态", "published_at": "2026-11-03T01:49:52+00:00", "published_at_disp": "11-03 09:49"}, {"title": "Simon Willison 的 LLM CLI 发布 0.37 版本", "summary": "Simon Willison 发布其 LLM 命令行工具 0.37 版，本次更新内容较多，涉及 CLI 交互与模型调用链路的改进。该工具长期作为本地快速调用多家 LLM API、做 prompt 实验与结果落盘的轻量入口，在极客圈有稳定用户群。具体新增特性与破坏性变更需查阅 release notes。", "analysis": "LLM CLI 的价值在于把多模型调用抽象成 Unix 管道里的一等公民，配合 sqlite-utils 做日志沉淀，是快速验证 prompt 的利器。0.37 这种版本号级别的迭代通常不会动核心抽象，但 CLI 工具的兼容性坑往往藏在插件生态里——升级前建议先锁版本跑一遍自己的脚本。", "link": "https://simonwillison.net/2026/Nov/2/llm/", "source": "Simon Willison", "score": 2.8, "tags": ["产品与发布", "CLI工具"], "category": "产品与发布", "published_at": "2026-11-02T23:49:30+00:00", "published_at_disp": "11-03 07:49"}, {"title": "观点：AI 精英可能像重商主义者囤积黄金一样囤积智能", "summary": "工程师 Venkatesh Rao 提出一个类比：对 AI 导致失业的恐惧类似于重商主义——把智能当作       }
      function renderPractical(s) {
        s = s.replace(/((?:落地要点)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderParagraph(s) {
        const parts = s.split(/\n+/);
        if (parts.length <= 1) return renderDefault(s);
        const head = parts[0].trim();
        const tail = parts.slice(1).map(p => p.trim()).filter(Boolean).join('<br/>');
        if (!tail) return renderDefault(s);
        return renderDefault(head) + '<br/><span class="meta-frag">' + renderDefault(tail) + '</span>';
      }
      // 深度解读/极客观点为段落式风格：分割器产出 analysis 字段，灰字独立成段展示
      const STYLE_RENDERERS = { '产品经理': renderPM, '微博热搜': renderWeibo, '工程实战派': renderPractical, '深度解读': renderParagraph, '极客观点': renderParagraph };
      function renderSummary(s) {
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const cleaned = esc
          .replace(/（(?:真需求|伪需求|商业模式存疑|卷但没用|值得抄)）/g, '')
          .replace(/（来源：[^（）、,，]{1,40}）/g, '');
        const renderer = STYLE_RENDERERS[__STYLE_NAME__] || renderDefault;
        return renderer(cleaned);
      }
      function renderAnalysis(s, label) {
        if (!s) return '';
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const lab = (label || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const labelHtml = lab ? '<span class="analysis-label">' + lab + '</span>' : '';
        return '<div class="card-analysis">' + labelHtml + renderDefault(esc) + '</div>';
      }
      const ANALYSIS_LABELS = { '深度解读': '解读：', '极客观点': '点评：' };

      // 新闻字段来自外部 RSS / AI 输出，进入 innerHTML 前必须转义；链接仅放行 http(s)
      const escH = s => String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      const safeHref = u => /^https?:\/\//i.test(String(u || '').trim()) ? escH(String(u).trim()) : '#';

      function buildNewsCard(item, idx) {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
            <div class="card-meta">
              <span class="card-index">No.${String(idx).padStart(2, '0')}</span>
              ${item.source ? `<span class="source-tag">${escH(item.source)}</span>` : ''}${item.published_at_disp ? `<span class="source-tag" style="color:#aaa;background:#f0f0ee;">发布于 ${escH(item.published_at_disp)}</span>` : ''}${item.tags && item.tags.length ? item.tags.filter(t => t !== item.category).map(t => `<span class="tag-tag">${escH(t)}</span>`).join('') : ''}
            </div>
            <div class="card-title">${escH(decorateTitle(item.title))}</div>
            <div class="card-summary">${renderSummary(item.summary)}</div>
            ${item.analysis ? renderAnalysis(item.analysis, ANALYSIS_LABELS[__STYLE_NAME__]) : ''}
            <div class="card-bottom">
              <a class="card-link" href="${safeHref(item.link)}" target="_blank" rel="noopener noreferrer">阅读原文</a>
              <div class="card-right">
                ${item.footnote ? `<span class="footnote">${escH(item.footnote)}</span>` : ''}
                ${item.score > 0 ? `<span class="score-badge ${item.score >= 4 ? 'high' : item.score >= 3 ? 'mid' : 'low'}">${Number(item.score).toFixed(1)}</span>` : ''}
              </div>
            </div>
          `;
        return card;
      }

      btn.disabled = true;
      list.innerHTML = '';
      list.classList.remove('visible');
      ac.classList.remove('visible');
      empty.classList.remove('visible');
      loading.classList.add('visible');

      setTimeout(() => {
        loading.classList.remove('visible');

        if (!__NEWS_DATA__ || __NEWS_DATA__.length === 0) {
          empty.classList.add('visible');
          btn.disabled = false;
          return;
        }

        // 按分类分组（category 字段为分类键，回退到 tags[0]）
        const groups = {};
        const CATEGORY_ORDER = ['大模型', 'Agent框架', '产品与发布', '论文与研究', '行业动态', '其他动态'];
        __NEWS_DATA__.forEach(item => {
          const cat = (item.category) || (item.tags && item.tags[0]) || '其他动态';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        });

        // 合并条目 < 2 的零散分类到「其他动态」，避免板块过于分散
        Object.keys(groups).forEach(cat => {
          if (cat === '其他动态') return;
          if (groups[cat].length < 2) {
            groups['其他动态'] = (groups['其他动态'] || []).concat(groups[cat]);
            delete groups[cat];
          }
        });

        // 按固定顺序渲染分类区块
        let globalIndex = 0;
        CATEGORY_ORDER.forEach(cat => {
          if (!groups[cat]) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        // 处理不在 CATEGORY_ORDER 中的分类
        Object.keys(groups).forEach(cat => {
          if (CATEGORY_ORDER.includes(cat)) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        list.classList.add('visible');

        // 项目推荐（本周热门学习项目）
        const projCard = document.getElementById('projects-card');
        if (projCard && __PROJECTS__ && __PROJECTS__.length) {
          const pHeader = document.createElement('div');
          pHeader.className = 'category-header';
          pHeader.textContent = `🚀 本周热门学习项目（${__PROJECTS__.length}条）`;
          projCard.appendChild(pHeader);
          __PROJECTS__.forEach(p => {
            const pc = document.createElement('div');
            pc.className = 'news-card';
            pc.innerHTML = `
              <div class="card-title"><a href="${safeHref(p.link)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;border-bottom:1px solid #1a1a1a;">${escH(p.name)}</a></div>
              <div class="card-summary">${escH(p.desc || '')}</div>
              <div class="card-meta">
                ${p.tag ? `<span class="tag-tag">${escH(p.tag)}</span>` : ''}
                ${p.stars ? `<span class="source-tag">${escH(p.stars)}</span>` : ''}
              </div>
            `;
            projCard.appendChild(pc);
          });
          projCard.classList.add('visible');
        }

        // 更多要闻（未进正文的条目，压缩为简讯）
        const briefCard = document.getElementById('briefs-card');
        if (briefCard && __BRIEFS__ && __BRIEFS__.length) {
          const bHeader = document.createElement('div');
          bHeader.className = 'category-header';
          bHeader.textContent = `📌 更多要闻（${__BRIEFS__.length}条）`;
          briefCard.appendChild(bHeader);
          __BRIEFS__.forEach(b => {
            const row = document.createElement('div');
            row.className = 'brief-row';
            const titleHtml = b.link
              ? `<a href="${safeHref(b.link)}" target="_blank" rel="noopener noreferrer">${escH(b.title)}</a>`
              : escH(b.title);
            row.innerHTML = `<div class="brief-title">${titleHtml}</div>` +
                            `<div class="brief-text">${escH(b.brief || '')}</div>`;
            briefCard.appendChild(row);
          });
          briefCard.classList.add('visible');
        }

        // 深度分析
        if (__DAILY_ANALYSIS__) {
          document.getElementById('analysis-content').innerHTML = renderSummary(__DAILY_ANALYSIS__);
          ac.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = '🔄 刷新';
      }, 800);
    }

    window.addEventListener('DOMContentLoaded', generateBriefing);
  </script>

</body>
</html>
