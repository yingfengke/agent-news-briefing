    const __NEWS_DATA__ = [{"title": "llama.cpp 与 ggml 双双发布 1.0，宣告 API 稳定", "summary": "Latent Space 的 AINews 提到 llama.cpp 和 ggml 同时达到 1.0 版本，正式宣告稳定性与向后兼容承诺。这意味着本地推理栈的核心底层库结束长期 0.x 迭代状态，API 进入冻结维护阶段。同期还讨论了「No AI Slop Manifesto」相关内容。", "analysis": "llama.cpp 到 1.0 是本地推理生态的分水岭：此前每次重构都让下游绑定（Ollama、LM Studio、各类 binding）跟着改，1.0 之后 ABI/API 稳定意味着可以放心做生产集成。ggml 同步 1.0 更关键，它是整个量化推理的底座，backend 抽象（CUDA/Metal/Vulkan/SYCL）终于有了版本契约。对做端侧部署的团队，这是可以锁依赖版本的信号。", "link": "https://latent.space/p/ainews-the-no-ai-slop-manifesto/", "source": "Latent Space", "score": 3.9, "tags": ["产品与发布", "本地推理", "开源"], "category": "产品与发布", "published_at": "2026-11-14T08:31:02+00:00", "published_at_disp": "11-14 16:31"}, {"title": "「史上最严」湿实验预测基准发布：推理拉满、算力翻 5 倍也白搭", "summary": "斯坦福、哈佛、康奈尔等十余家顶尖团队联合发布湿实验预测基准，号称史上最严。结果显示，即便把推理强度拉满、算力提升 5 倍，模型在该基准上的表现也没有实质改善，暴露出当前 LLM 在真实科学实验预测上的能力天花板。", "analysis": "算力翻 5 倍仍无提升，说明瓶颈不在 test-time compute，而在表征与先验缺失——湿实验涉及的反应条件、浓度、温度等连续变量空间，LLM 的 token 化表示天然吃亏。这类负结果基准比刷榜型 benchmark 有价值得多，它明确划出了 scaling 的失效边界。对做 AI for Science 的团队，这是该转向结构化建模与实验闭环的信号。", "link": "https://www.qbitai.com/2026/11/510232.html", "source": "量子位", "score": 3.8, "tags": ["论文与研究", "benchmark", "AI for Science"], "category": "论文与研究", "published_at": "2026-11-14T09:58:22+00:00", "published_at_disp": "11-14 17:58"}, {"title": "斯坦福开源 Memorilla：给冻结 LLM 加 16 个 latent memory token", "summary": "斯坦福团队开源 Memorilla，一个面向冻结 LLM 的潜在记忆模块，核心是用 16 个 memory token 承载外部知识，无需改动主干权重即可扩展模型记忆。项目已公开代码，定位是给不可微调或不愿微调的模型提供轻量记忆注入路径。", "analysis": "16 个 token 的 latent slot 做记忆压缩，思路接近 prefix-tuning 与 memory transformer 的杂交，但把预算压到极低。关键问题是这 16 个 slot 的信息容量上限——按每 token 隐空间维度 d 估算，能塞进去的事实量有限，适合做任务级 persona/领域偏置而非知识库。冻结主干意味着训练成本极低，这是它相对 LoRA 的真正卖点；但如果只在单一 benchmark 上验证，泛化性要打问号。", "link": "https://www.marktechpost.com/2026/11/14/stanford-memorilla-memory-system-16-memory-tokens/", "source": "MarkTechPost", "score": 3.7, "tags": ["论文与研究", "记忆模块", "开源"], "category": "论文与研究", "published_at": "2026-11-14T10:21:21+00:00", "published_at_disp": "11-14 18:21"}, {"title": "Gemini 4 Carbon 拿下 MathArena 榜首，但成本是 GPT-6.1 Sol 的 15 倍", "summary": "MathArena AI 数学基准出现久违的格局变化：OpenAI 模型首次不再领跑，Gemini 4 Carbon 登顶。但代价是单次推理成本达到 GPT-6.1 Sol 的 15 倍，性价比严重失衡。榜单同时显示数学推理的 SOTA 之争已从「谁更强」转向「每美元能换多少正确率」。", "analysis": "MathArena 这种竞赛级数学 benchmark 的边际收益已经很低，15 倍成本换一个榜首名次，本质是用算力堆 CoT 长度和 self-consistency 采样数。真正该看的是 pass@1 与每千 token 成本的比值，而不是裸分。Gemini 4 Carbon 大概率在推理时开了更长的 thinking budget，这对生产环境几乎不可用；如果 Google 不给出可调的 reasoning effort 档位，这个 crown 就是纯 PR 价值。", "link": "https://the-decoder.com/gemini-4-carbon-takes-the-matharena-crown-but-costs-15-times-more-than-gpt-6-1-sol/", "source": "The Decoder", "score": 3.6, "tags": ["大模型", "benchmark", "推理成本"], "category": "大模型", "published_at": "2026-11-14T16:48:01+00:00", "published_at_disp": "11-15 00:48"}, {"title": "Agent 历史清理反而有害：世界状态仍持有错误时别急着删", "summary": "一篇新 arXiv 论文指出，工具调用型语言模型 Agent 在清理自身对话历史时存在反直觉风险：当外部世界状态仍然保留着此前错误（如已写入的错误数据、已发出的错误请求）时，单纯裁剪 Agent 上下文会让它丢失纠错线索，导致错误被固化。论文针对 tool-using agent 的历史管理策略给出分析。", "analysis": "这条戳中了所有做长程 Agent 的人的痛点：context compaction 不是无损操作，它同时删掉了「我犯过错」的证据。工程上这意味着 history pruning 必须和外部状态回滚（事务、幂等写、补偿操作）配套设计，否则压缩上下文等于把 bug 埋进环境里。论文价值在于把「上下文管理」从 token 预算问题重新定义为一致性问题，这个视角比具体方法更重要。", "link": "https://arxiv.org/abs/2611.14654", "source": "ArXiv AI", "score": 3.6, "tags": ["论文与研究", "Agent", "上下文管理"], "category": "论文与研究", "published_at": "2026-11-14T05:00:00+00:00", "published_at_disp": "11-14 13:00"}, {"title": "Vercel 发布 UI SDK：给 AI 编码 Agent 提供 50+ 种 UI 行为", "summary": "Vercel Labs 开源 UI SDK（beta），提供 50 多种界面行为原语，专门面向 AI coding agent 生成前端代码的场景。目标是让 Agent 在生成 UI 时调用标准化行为组件，而不是每次从零拼装交互逻辑。项目以开源 beta 形式发布。", "analysis": "这是把「Agent 生成前端」从自由发挥收敛到受约束 DSL 的思路，50+ 行为原语相当于给 LLM 一套可枚举的 action space，能显著降低生成代码的交互 bug 率。坑在于绑定 Vercel 生态的隐性成本，以及行为原语的抽象粒度——太细 Agent 用不动，太粗又退化成模板。对做 agentic frontend 的团队值得拉下来跑一遍，但别指望它解决布局审美问题。", "link": "https://www.marktechpost.com/2026/11/13/vercel-ui-sdk-agent-ui-behaviors/", "source": "MarkTechPost", "score": 3.5, "tags": ["产品与发布", "AI 编码", "开源"], "category": "产品与发布", "published_at": "2026-11-14T06:38:14+00:00", "published_at_disp": "11-14 14:38"}, {"title": "Cmpnd 发布 dspy-wsp：把权重空间编程带进 DSPy", "summary": "Cmpnd 推出 dspy-wsp，一个原型优化器，将 weight-space programming 引入 DSPy 生态。它让 DSPy 的 prompt/程序优化管线可以直接触及模型权重层面的调整，而不只停留在 prompt 与 few-shot 示例的搜索空间。目前为 prototype 阶段。", "analysis": "DSPy 一直卡在「只优化 prompt 和 demo，不碰权重」的天花板上，dspy-wsp 试图把优化器的作用域从离散文本空间扩展到连续参数空间。方向对，但 prototype 意味着接口和收敛性都没验证；weight-space 优化对显存和训练吞吐的要求会直接劝退大部分只跑 inference API 的用户。真正的看点是它能否复用 DSPy 的 metric-driven 编译流程，如果能，才算把 prompt engineering 和 fine-tuning 统一到一个抽象层。", "link": "https://www.marktechpost.com/2026/11/14/cmpnd-dspy-wsp-weight-space-programming/", "source": "MarkTechPost", "score": 3.4, "tags": ["Agent框架", "DSPy", "权重优化"], "category": "Agent框架", "published_at": "2026-11-14T16:45:48+00:00", "published_at_disp": "11-15 00:45"}, {"title": "推理提速 10 倍后，工具调用成了新瓶颈", "summary": "Gimlet Labs 的 nserrino 在 aiDotEngineer 分享：当推理侧优化把速度提升 10 倍之后，Agent 流水线的瓶颈已经转移到 tool call 环节。讨论聚焦于工具调用的调度、并发与往返延迟，而非模型本身的生成速度。", "analysis": "这是典型的 Amdahl 定律现场：把 LLM decode 从 100ms/token 压到 10ms 级之后，一次 HTTP tool call 的 200-500ms RTT 立刻成为主导项。解法无非三条——工具本地化/常驻连接、并行 speculative tool call、以及把高频工具做成 in-process function。真正的坑是 tool call 的串行依赖链，并行化受限于数据依赖图，这块目前没有通用解。", "link": "https://x.com/aiDotEngineer/status/2121755058542944628", "source": "Twitter @aiDotEngineer", "score": 3.4, "tags": ["Agent框架", "工具调用", "推理优化"], "category": "Agent框架", "published_at": "2026-11-15T00:00:00+00:00", "published_at_disp": "11-15 08:00"}, {"title": "推理不是越多越好：何时降档、如何跨模型委派", "summary": "aiDotEngineer 分享观点：更多 reasoning 并不总是更优，关键是在任务维度上判断何时调低推理强度，以及如何把子任务委派给不同模型。核心论点是推理预算应按任务难度动态分配，而非全局拉满，否则延迟和成本双输。", "analysis": "这就是 reasoning effort 路由问题，和 AWS 那套 Bedrock 模型路由是同一类工程命题。真正可落地的是按任务类型做静态分档（分类/抽取走低档，多步规划走高挡），动态难度估计目前误判率还太高。跨模型委派的价值在于用便宜模型做 draft、贵模型做 verify，但要注意 tool call 的 schema 兼容性，否则委派链一断就全盘重试。", "link": "https://x.com/aiDotEngineer/status/2121709762652033150", "source": "Twitter @aiDotEngineer", "score": 3.3, "ta       }
      function renderWeibo(s) {
        s = s.replace(/((?:网友[A-Za-z一二三四五六七八九十]{0,2}?)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      // 微博热度标记补 emoji：提示词已要求模型直接输出，模型漏加时渲染层兜底补齐
      const WEIBO_HEAT_MARKS = { '爆': '🔥爆', '沸': '🔥沸', '热': '📈热' };
      function decorateTitle(t) {
        if (__STYLE_NAME__ !== '微博热搜') return t;
        const s = String(t || '');
        return WEIBO_HEAT_MARKS[s[0]] ? WEIBO_HEAT_MARKS[s[0]] + s.slice(1) : s;
      }
      function renderPractical(s) {
        s = s.replace(/((?:落地要点)[：:])/g, labelFrag() + '$1</span>');
        return renderDefault(s);
      }
      function renderParagraph(s) {
        const parts = s.split(/\n+/);
        if (parts.length <= 1) return renderDefault(s);
        const head = parts[0].trim();
        const tail = parts.slice(1).map(p => p.trim()).filter(Boolean).join('<br/>');
        if (!tail) return renderDefault(s);
        return renderDefault(head) + '<br/><span class="meta-frag">' + renderDefault(tail) + '</span>';
      }
      // 深度解读/极客观点为段落式风格：分割器产出 analysis 字段，灰字独立成段展示
      const STYLE_RENDERERS = { '产品经理': renderPM, '微博热搜': renderWeibo, '工程实战派': renderPractical, '深度解读': renderParagraph, '极客观点': renderParagraph };
      function renderSummary(s) {
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const cleaned = esc
          .replace(/（(?:真需求|伪需求|商业模式存疑|卷但没用|值得抄)）/g, '')
          .replace(/（来源：[^（）、,，]{1,40}）/g, '');
        const renderer = STYLE_RENDERERS[__STYLE_NAME__] || renderDefault;
        return renderer(cleaned);
      }
      function renderAnalysis(s, label) {
        if (!s) return '';
        const esc = (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const lab = (label || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const labelHtml = lab ? '<span class="analysis-label">' + lab + '</span>' : '';
        return '<div class="card-analysis">' + labelHtml + renderDefault(esc) + '</div>';
      }
      const ANALYSIS_LABELS = { '深度解读': '解读：', '极客观点': '点评：' };

      // 新闻字段来自外部 RSS / AI 输出，进入 innerHTML 前必须转义；链接仅放行 http(s)
      const escH = s => String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      const safeHref = u => /^https?:\/\//i.test(String(u || '').trim()) ? escH(String(u).trim()) : '#';

      function buildNewsCard(item, idx) {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
            <div class="card-meta">
              <span class="card-index">No.${String(idx).padStart(2, '0')}</span>
              ${item.source ? `<span class="source-tag">${escH(item.source)}</span>` : ''}${item.published_at_disp ? `<span class="source-tag" style="color:#aaa;background:#f0f0ee;">发布于 ${escH(item.published_at_disp)}</span>` : ''}${item.tags && item.tags.length ? item.tags.filter(t => t !== item.category).map(t => `<span class="tag-tag">${escH(t)}</span>`).join('') : ''}
            </div>
            <div class="card-title">${escH(decorateTitle(item.title))}</div>
            <div class="card-summary">${renderSummary(item.summary)}</div>
            ${item.analysis ? renderAnalysis(item.analysis, ANALYSIS_LABELS[__STYLE_NAME__]) : ''}
            <div class="card-bottom">
              <a class="card-link" href="${safeHref(item.link)}" target="_blank" rel="noopener noreferrer">阅读原文</a>
              <div class="card-right">
                ${item.footnote ? `<span class="footnote">${escH(item.footnote)}</span>` : ''}
                ${item.score > 0 ? `<span class="score-badge ${item.score >= 4 ? 'high' : item.score >= 3 ? 'mid' : 'low'}">${Number(item.score).toFixed(1)}</span>` : ''}
              </div>
            </div>
          `;
        return card;
      }

      btn.disabled = true;
      list.innerHTML = '';
      list.classList.remove('visible');
      ac.classList.remove('visible');
      empty.classList.remove('visible');
      loading.classList.add('visible');

      setTimeout(() => {
        loading.classList.remove('visible');

        if (!__NEWS_DATA__ || __NEWS_DATA__.length === 0) {
          empty.classList.add('visible');
          btn.disabled = false;
          return;
        }

        // 按分类分组（category 字段为分类键，回退到 tags[0]）
        const groups = {};
        const CATEGORY_ORDER = ['大模型', 'Agent框架', '产品与发布', '论文与研究', '行业动态', '其他动态'];
        __NEWS_DATA__.forEach(item => {
          const cat = (item.category) || (item.tags && item.tags[0]) || '其他动态';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(item);
        });

        // 合并条目 < 2 的零散分类到「其他动态」，避免板块过于分散
        Object.keys(groups).forEach(cat => {
          if (cat === '其他动态') return;
          if (groups[cat].length < 2) {
            groups['其他动态'] = (groups['其他动态'] || []).concat(groups[cat]);
            delete groups[cat];
          }
        });

        // 按固定顺序渲染分类区块
        let globalIndex = 0;
        CATEGORY_ORDER.forEach(cat => {
          if (!groups[cat]) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        // 处理不在 CATEGORY_ORDER 中的分类
        Object.keys(groups).forEach(cat => {
          if (CATEGORY_ORDER.includes(cat)) return;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${cat}（${groups[cat].length}条）`;
          list.appendChild(header);

          groups[cat].forEach((item) => {
            list.appendChild(buildNewsCard(item, ++globalIndex));
          });
        });

        list.classList.add('visible');

        // 项目推荐（本周热门学习项目）
        const projCard = document.getElementById('projects-card');
        if (projCard && __PROJECTS__ && __PROJECTS__.length) {
          const pHeader = document.createElement('div');
          pHeader.className = 'category-header';
          pHeader.textContent = `🚀 本周热门学习项目（${__PROJECTS__.length}条）`;
          projCard.appendChild(pHeader);
          __PROJECTS__.forEach(p => {
            const pc = document.createElement('div');
            pc.className = 'news-card';
            pc.innerHTML = `
              <div class="card-title"><a href="${safeHref(p.link)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;border-bottom:1px solid #1a1a1a;">${escH(p.name)}</a></div>
              <div class="card-summary">${escH(p.desc || '')}</div>
              <div class="card-meta">
                ${p.tag ? `<span class="tag-tag">${escH(p.tag)}</span>` : ''}
                ${p.stars ? `<span class="source-tag">${escH(p.stars)}</span>` : ''}
              </div>
            `;
            projCard.appendChild(pc);
          });
          projCard.classList.add('visible');
        }

        // 更多要闻（未进正文的条目，压缩为简讯）
        const briefCard = document.getElementById('briefs-card');
        if (briefCard && __BRIEFS__ && __BRIEFS__.length) {
          const bHeader = document.createElement('div');
          bHeader.className = 'category-header';
          bHeader.textContent = `📌 更多要闻（${__BRIEFS__.length}条）`;
          briefCard.appendChild(bHeader);
          __BRIEFS__.forEach(b => {
            const row = document.createElement('div');
            row.className = 'brief-row';
            const titleHtml = b.link
              ? `<a href="${safeHref(b.link)}" target="_blank" rel="noopener noreferrer">${escH(b.title)}</a>`
              : escH(b.title);
            row.innerHTML = `<div class="brief-title">${titleHtml}</div>` +
                            `<div class="brief-text">${escH(b.brief || '')}</div>`;
            briefCard.appendChild(row);
          });
          briefCard.classList.add('visible');
        }

        // 深度分析
        if (__DAILY_ANALYSIS__) {
          document.getElementById('analysis-content').innerHTML = renderSummary(__DAILY_ANALYSIS__);
          ac.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = '🔄 刷新';
      }, 800);
    }

    window.addEventListener('DOMContentLoaded', generateBriefing);
  </script>

</body>
</html>
