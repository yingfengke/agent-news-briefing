name: AI Agent 开发者晨报

on:
  # 每天早上 6:30 北京时间 (22:30 UTC)
  # 注意：GitHub Actions 的 schedule 触发存在不可控延迟（官方已知行为，高负载时段尤甚）。
  # 实测历史：设定 9:00 时实际下午 13~14 点才运行；设定 6:00 时实际 9~10 点才运行。
  # 06:30 为测试值，错开整点高负载窗口观察能否提前；若实测比 6:00 更晚，改回 '0 22 * * *'。
  schedule:
    - cron: '30 22 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-briefing:
    if: github.event.schedule == '30 22 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # 所有步骤共享的环境变量（来自 GitHub Secrets，无一硬编码）
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      AUTH_CODE: ${{ secrets.AUTH_CODE }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip check

      - name: 依赖安全审计
        run: |
          pip install pip-audit
          pip-audit --desc on -r requirements.txt || (echo "::warning::存在已知漏洞依赖，建议及时更新" && exit 1)

      # 恢复 URL 去重缓存（状态文件不推送至仓库，通过 Actions Cache 持久化）
      - name: 恢复 URL 去重缓存
        uses: actions/cache@v6
        id: url-dedup-cache
        with:
          path: .url_dedup_db.json
          key: url-dedup-db-${{ github.run_id }}
          restore-keys: |
            url-dedup-db-

      # 恢复同日重跑 raw 缓存（复用当日已去重原始数据，避免重跑时重抓新闻）
      - name: 恢复 Raw 缓存
        uses: actions/cache@v6
        id: raw-cache
        with:
          path: web/.raw_pool_cache.json
          key: raw-cache-${{ github.run_id }}
          restore-keys: |
            raw-cache-

      # ============================================================
      # 以下关键步骤使用 retry 机制：
      #   失败后重试，覆盖网络超时、API 限流、SMTP 临时故障等场景
      #   max_attempts=1：不反复重跑整个 main.py，模型层已有 max_retries=1 兜底
      # ============================================================

      - name: ① 抓取新闻 + AI 分析 + 生成 HTML（失败自动重试）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 1
          retry_wait_seconds: 300
          command: python -m src.main

      - name: ② 发送邮件推送（失败自动重试）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 1
          retry_wait_seconds: 300
          command: python -m src.delivery.send_email

      # 贡献图绿点归日规则：按 commit 时间戳内的时区归日。
      # Actions 服务器为 UTC，06:00 BJT 的提交时间戳为前日 22:00 UTC，
      # 会被记入"昨天"的格子——须显式设 TZ=Asia/Shanghai 使时间戳为 +0800。
      - name: ③ 提交并推送网页文件（标准 git push，贡献图计数）
        env:
          TZ: Asia/Shanghai
          # 提交作者邮箱：复用发件邮箱 secret（须为 GitHub 账号已绑定邮箱）
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ env.SENDER_EMAIL }}"
          git add web/index.html web/tech-briefing.html web/tech-briefing.template.html web/rss.xml
          git diff --cached --quiet || git commit -m "每日简报自动更新"
          git push origin main

      # 保存 URL 去重缓存供下次运行使用
      - name: 保存 URL 去重缓存
        uses: actions/cache/save@v6
        with:
          path: .url_dedup_db.json
          key: url-dedup-db-${{ github.run_id }}

      # 保存 Raw 缓存供同日重跑复用
      - name: 保存 Raw 缓存
        uses: actions/cache/save@v6
        with:
          path: web/.raw_pool_cache.json
          key: raw-cache-${{ github.run_id }}
